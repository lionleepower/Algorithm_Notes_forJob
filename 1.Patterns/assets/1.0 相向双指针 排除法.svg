<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <defs>
    <marker id="p10a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .cell{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .dead{fill:#f0f1f3;stroke:#e1e4e8;stroke-width:1}
    .cutR{fill:#ffebe9;stroke:#cf222e;stroke-width:1.5}
    .cutG{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .cur{fill:#ddf4ff;stroke:#0969da;stroke-width:2.5}
    .ar{stroke:#57606a;stroke-width:2;fill:none;marker-end:url(#p10a)}
  </style>

  <rect width="800" height="440" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="38">相向双指针为什么是 O(n)：每一步都排除掉<tspan fill="#cf222e">一整行</tspan>或<tspan fill="#1a7f37">一整列</tspan></text>
  <text class="sub" x="32" y="60">格子 (left, right) = 一个候选组合。暴力要看 n²/2 个格子，双指针只走 2n 步</text>

  <!-- 列头 -->
  <text class="mono" x="150" y="98" font-size="12" text-anchor="middle" fill="#57606a">r=0</text>
  <text class="mono" x="200" y="98" font-size="12" text-anchor="middle" fill="#57606a">1</text>
  <text class="mono" x="250" y="98" font-size="12" text-anchor="middle" fill="#57606a">2</text>
  <text class="mono" x="300" y="98" font-size="12" text-anchor="middle" fill="#57606a">3</text>
  <text class="mono" x="350" y="98" font-size="12" text-anchor="middle" fill="#57606a">4</text>
  <!-- 行头 -->
  <text class="mono" x="118" y="130" font-size="12" text-anchor="end" fill="#57606a">l=0</text>
  <text class="mono" x="118" y="180" font-size="12" text-anchor="end" fill="#57606a">1</text>
  <text class="mono" x="118" y="230" font-size="12" text-anchor="end" fill="#57606a">2</text>
  <text class="mono" x="118" y="280" font-size="12" text-anchor="end" fill="#57606a">3</text>
  <text class="mono" x="118" y="330" font-size="12" text-anchor="end" fill="#57606a">4</text>

  <!-- 第 0 行：l=0 -->
  <rect class="dead" x="126" y="108" width="48" height="40"/>
  <rect class="cutG" x="176" y="108" width="48" height="40"/>
  <rect class="cutG" x="226" y="108" width="48" height="40"/>
  <rect class="cutG" x="276" y="108" width="48" height="40"/>
  <rect class="cur"  x="326" y="108" width="48" height="40"/>
  <text class="mono" x="350" y="133" font-size="12" text-anchor="middle" font-weight="600" fill="#0969da">当前</text>

  <!-- 其余行 -->
  <rect class="dead" x="126" y="158" width="48" height="40"/><rect class="dead" x="176" y="158" width="48" height="40"/>
  <rect class="cell" x="226" y="158" width="48" height="40"/><rect class="cell" x="276" y="158" width="48" height="40"/>
  <rect class="cutR" x="326" y="158" width="48" height="40"/>

  <rect class="dead" x="126" y="208" width="48" height="40"/><rect class="dead" x="176" y="208" width="48" height="40"/>
  <rect class="dead" x="226" y="208" width="48" height="40"/><rect class="cell" x="276" y="208" width="48" height="40"/>
  <rect class="cutR" x="326" y="208" width="48" height="40"/>

  <rect class="dead" x="126" y="258" width="48" height="40"/><rect class="dead" x="176" y="258" width="48" height="40"/>
  <rect class="dead" x="226" y="258" width="48" height="40"/><rect class="dead" x="276" y="258" width="48" height="40"/>
  <rect class="cutR" x="326" y="258" width="48" height="40"/>

  <rect class="dead" x="126" y="308" width="48" height="40"/><rect class="dead" x="176" y="308" width="48" height="40"/>
  <rect class="dead" x="226" y="308" width="48" height="40"/><rect class="dead" x="276" y="308" width="48" height="40"/>
  <rect class="dead" x="326" y="308" width="48" height="40"/>

  <text class="sub" x="126" y="372" font-size="11.5">灰色 = left ≥ right，本来就不是候选</text>

  <!-- 右侧说明 -->
  <rect x="410" y="90" width="358" height="118" fill="#ffffff" stroke="#cf222e" stroke-width="1.5" rx="8"/>
  <text x="428" y="116" font-size="14" font-weight="600" fill="#cf222e">s &gt; target　⇒　right -= 1，砍掉一整列</text>
  <text class="mono" x="428" y="142" font-size="12">a[l] + a[r] &gt; target</text>
  <text class="sub"  x="428" y="164" font-size="12.5">对任意 l' &gt; l 都有 a[l'] ≥ a[l]，所以</text>
  <text class="mono" x="428" y="184" font-size="12">a[l'] + a[r] ≥ a[l] + a[r] &gt; target</text>
  <text class="sub"  x="428" y="202" font-size="12">这一列全体出局，一个都不用试。</text>

  <rect x="410" y="222" width="358" height="118" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5" rx="8"/>
  <text x="428" y="248" font-size="14" font-weight="600" fill="#1a7f37">s &lt; target　⇒　left += 1，砍掉一整行</text>
  <text class="mono" x="428" y="274" font-size="12">a[l] + a[r] &lt; target</text>
  <text class="sub"  x="428" y="296" font-size="12.5">对任意 r' &lt; r 都有 a[r'] ≤ a[r]，所以</text>
  <text class="mono" x="428" y="316" font-size="12">a[l] + a[r'] ≤ a[l] + a[r] &lt; target</text>
  <text class="sub"  x="428" y="334" font-size="12">这一行全体出局。</text>

  <!-- 底部 -->
  <line x1="32" y1="386" x2="768" y2="386" stroke="#d0d7de" stroke-width="1"/>
  <text x="32" y="410" font-size="13.5" font-weight="600">前提：数组必须有序 —— 这就是「排序」的全部作用（另一半作用是让重复元素相邻，方便去重）</text>
  <text class="sub" x="32" y="432" font-size="13">无序时 <tspan class="mono">left += 1</tspan> 不保证和变大、<tspan class="mono">right -= 1</tspan> 不保证和变小，上面两条论证同时失效。</text>
</svg>
