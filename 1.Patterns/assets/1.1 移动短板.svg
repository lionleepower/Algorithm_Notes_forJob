<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .bar{fill:#8c959f;stroke:#24292f;stroke-width:1.5}
    .barS{fill:#f5b7b1;stroke:#cf222e;stroke-width:2.5}
    .barT{fill:#b6d7f5;stroke:#0969da;stroke-width:2.5}
    .water{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;stroke-dasharray:5 3}
  </style>

  <rect width="800" height="440" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="38">盛最多水：为什么一定移动短板</text>
  <text class="sub" x="32" y="60">面积 = (right − left) × min(height[left], height[right])　——　<tspan font-weight="600" fill="#1f2328">高度由短板决定</tspan>，这是全部理由</text>

  <!-- 左：移动高板 -->
  <rect x="32" y="80" width="356" height="230" fill="#ffffff" stroke="#cf222e" stroke-width="1.5" rx="8"/>
  <text x="50" y="106" font-size="14" font-weight="600" fill="#cf222e">✗ 移动高板：面积不可能变大</text>

  <line x1="60" y1="250" x2="360" y2="250" stroke="#8c959f" stroke-width="1.5"/>
  <rect class="barS" x="76"  y="190" width="34" height="60"/>
  <text class="mono" x="93" y="268" font-size="12" text-anchor="middle" fill="#cf222e">left</text>
  <text class="mono" x="93" y="182" font-size="12" text-anchor="middle">3</text>

  <rect class="barT" x="286" y="130" width="34" height="120"/>
  <text class="mono" x="303" y="268" font-size="12" text-anchor="middle" fill="#0969da">right</text>
  <text class="mono" x="303" y="122" font-size="12" text-anchor="middle">7</text>

  <rect class="water" x="110" y="190" width="176" height="60"/>
  <text class="sub" x="198" y="224" font-size="12" text-anchor="middle" fill="#0969da">高度只能到 3</text>

  <rect class="bar" x="232" y="210" width="34" height="40" opacity="0.5"/>
  <text class="mono" x="249" y="268" font-size="11" text-anchor="middle" fill="#8c959f">right−1</text>

  <text class="sub" x="50" y="288" font-size="12.5">宽度<tspan font-weight="600" fill="#cf222e">一定变小</tspan>，高度仍被左边的 3 卡住 ⇒ 面积严格不增。</text>

  <!-- 右：移动短板 -->
  <rect x="412" y="80" width="356" height="230" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5" rx="8"/>
  <text x="430" y="106" font-size="14" font-weight="600" fill="#1a7f37">✓ 移动短板：高度才有机会变大</text>

  <line x1="440" y1="250" x2="740" y2="250" stroke="#8c959f" stroke-width="1.5"/>
  <rect class="bar" x="456" y="190" width="34" height="60" opacity="0.4"/>
  <text class="mono" x="473" y="268" font-size="11" text-anchor="middle" fill="#8c959f">left</text>

  <rect class="barS" x="510" y="150" width="34" height="100"/>
  <text class="mono" x="527" y="268" font-size="12" text-anchor="middle" fill="#1a7f37">left+1</text>
  <text class="mono" x="527" y="142" font-size="12" text-anchor="middle">5</text>

  <rect class="barT" x="666" y="130" width="34" height="120"/>
  <text class="mono" x="683" y="268" font-size="12" text-anchor="middle" fill="#0969da">right</text>
  <text class="mono" x="683" y="122" font-size="12" text-anchor="middle">7</text>

  <rect class="water" x="544" y="150" width="122" height="100"/>
  <text class="sub" x="605" y="204" font-size="12" text-anchor="middle" fill="#1a7f37">高度升到 5</text>

  <text class="sub" x="430" y="288" font-size="12.5">宽度同样变小，但短板换人后<tspan font-weight="600" fill="#1a7f37">高度可能变大</tspan> ⇒ 面积有机会更优。</text>

  <!-- 底部 -->
  <line x1="32" y1="336" x2="768" y2="336" stroke="#d0d7de" stroke-width="1"/>
  <text x="32" y="360" font-size="13.5" font-weight="600">和 1.0 是同一个「排除法」</text>
  <text class="sub" x="32" y="382" font-size="13">移动短板 = 断定「以这块短板为边界的所有组合都不可能更优」，于是<tspan font-weight="600" fill="#1f2328">一次排除一整行/列</tspan>，指针永不回头 ⇒ O(n)。</text>
  <text class="sub" x="32" y="410" font-size="13">区别只在排除的依据：1.0 靠<tspan font-weight="600" fill="#1f2328">排序后的单调性</tspan>，本题靠<tspan font-weight="600" fill="#1f2328">「短板决定高度」+ 宽度必减</tspan>。</text>
  <text class="sub" x="32" y="432" font-size="13">所以 11 不需要排序 —— 它的单调性来自面积公式本身，而不是数组顺序。</text>
</svg>
