<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sec{font-size:14px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .bar{stroke-width:1.5;rx:5}
    .blue{fill:#ddf4ff;stroke:#0969da}
    .green{fill:#dafbe1;stroke:#1a7f37}
    .gray{fill:#f6f8fa;stroke:#8c959f;stroke-dasharray:4 3}
    .axis{stroke:#d0d7de;stroke-width:1.5}
  </style>

  <rect width="820" height="470" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="36">区间题的第一步永远是排序 —— 排序键决定了它是哪一类题</text>
  <text class="sub" x="32" y="58">同一堆区间，按左端点排是「合并」，按右端点排是「最多能留几个不相交的」。</text>

  <!-- ============ 上半：按左端点排序 ============ -->
  <text class="sec" x="32" y="96" fill="#0969da">A. 按左端点排序 → 合并类（56 合并区间 / 57 插入区间）</text>
  <text class="sub" x="32" y="116">左端点递增后，新区间只可能和「当前正在合并的那一个」相交，于是一趟扫描就够。</text>

  <line class="axis" x1="60" y1="196" x2="770" y2="196"/>
  <text class="mono sub" x="60"  y="214" font-size="11" text-anchor="middle">0</text>
  <text class="mono sub" x="290" y="214" font-size="11" text-anchor="middle">5</text>
  <text class="mono sub" x="520" y="214" font-size="11" text-anchor="middle">10</text>
  <text class="mono sub" x="750" y="214" font-size="11" text-anchor="middle">15</text>

  <rect class="bar blue" x="106" y="134" width="92"  height="18"/>
  <text class="mono sub" x="152" y="130" font-size="11" text-anchor="middle">[1,3]</text>
  <rect class="bar blue" x="152" y="158" width="184" height="18"/>
  <text class="mono sub" x="244" y="154" font-size="11" text-anchor="middle">[2,6]</text>
  <rect class="bar blue" x="428" y="134" width="92"  height="18"/>
  <text class="mono sub" x="474" y="130" font-size="11" text-anchor="middle">[8,10]</text>
  <rect class="bar blue" x="612" y="134" width="138" height="18"/>
  <text class="mono sub" x="681" y="130" font-size="11" text-anchor="middle">[12,15]</text>

  <text class="sub" x="32" y="246" font-size="12">合并结果</text>
  <rect class="bar green" x="106" y="232" width="230" height="20"/>
  <text class="mono" x="221" y="246" font-size="12" text-anchor="middle" fill="#1a7f37">[1,6]</text>
  <rect class="bar green" x="428" y="232" width="92"  height="20"/>
  <text class="mono" x="474" y="246" font-size="12" text-anchor="middle" fill="#1a7f37">[8,10]</text>
  <rect class="bar green" x="612" y="232" width="138" height="20"/>
  <text class="mono" x="681" y="246" font-size="12" text-anchor="middle" fill="#1a7f37">[12,15]</text>

  <line x1="32" y1="276" x2="788" y2="276" stroke="#d0d7de" stroke-width="1"/>

  <!-- ============ 下半：按右端点排序 ============ -->
  <text class="sec" x="32" y="304" fill="#1a7f37">B. 按右端点排序 → 不相交子集 / 贪心（435 无重叠区间 / 452 引爆气球）</text>
  <text class="sub" x="32" y="324">右端点最小的那个「最不挡路」，先收下它一定不亏——这就是交换论证 exchange argument。</text>

  <line class="axis" x1="60" y1="428" x2="770" y2="428"/>

  <rect class="bar green" x="152" y="344" width="92"  height="18"/>
  <text class="mono" x="198" y="340" font-size="11" text-anchor="middle" fill="#1a7f37">[2,4] 选</text>
  <rect class="bar green" x="290" y="368" width="92"  height="18"/>
  <text class="mono" x="336" y="364" font-size="11" text-anchor="middle" fill="#1a7f37">[5,7] 选</text>
  <rect class="bar gray"  x="336" y="392" width="276" height="18"/>
  <text class="mono sub" x="474" y="388" font-size="11" text-anchor="middle">[6,12] 弃（6 &lt; 7 相交）</text>
  <rect class="bar gray"  x="106" y="416" width="598" height="18"/>
  <text class="mono sub" x="405" y="412" font-size="11" text-anchor="middle">[1,14] 弃（1 &lt; 7 相交）</text>

  <text class="mono" x="32" y="460" font-size="12.5" fill="#cf222e">排错键就做不出来：按左端点排做 435，会先收下最长的 [1,14]，把后面全挡掉。</text>
</svg>
