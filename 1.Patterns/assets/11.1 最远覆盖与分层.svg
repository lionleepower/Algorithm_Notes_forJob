<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <defs>
    <marker id="arJ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .cap{font-size:13px;font-weight:600;fill:#0969da}
    .c{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5;rx:5}
    .L0{fill:#ddf4ff;stroke:#0969da;stroke-width:1.8;rx:5}
    .L1{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.8;rx:5}
    .L2{fill:#fff8c5;stroke:#bf8700;stroke-width:1.8;rx:5}
    .ar{stroke:#0969da;stroke-width:1.8;fill:none;marker-end:url(#arJ)}
    .brk{stroke:#57606a;stroke-width:1.6;fill:none}
    .cut{stroke:#cf222e;stroke-width:2;stroke-dasharray:5 4}
  </style>

  <rect width="820" height="470" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="36">45 跳跃游戏 II：一次跳跃 = BFS 的一层，答案就是层数</text>
  <text class="mono sub" x="32" y="58">nums = [2, 3, 1, 1, 4]　far = 扫到目前为止能摸到的最远下标　end = 当前这一层的右边界</text>

  <!-- 数组 -->
  <text class="mono sub" x="118" y="104" font-size="12" text-anchor="end">下标</text>
  <text class="mono sub" x="172" y="104" font-size="12" text-anchor="middle">0</text>
  <text class="mono sub" x="292" y="104" font-size="12" text-anchor="middle">1</text>
  <text class="mono sub" x="412" y="104" font-size="12" text-anchor="middle">2</text>
  <text class="mono sub" x="532" y="104" font-size="12" text-anchor="middle">3</text>
  <text class="mono sub" x="652" y="104" font-size="12" text-anchor="middle">4</text>

  <rect class="L0" x="132" y="116" width="80" height="44"/><text class="mono" x="172" y="145" font-size="17" text-anchor="middle">2</text>
  <rect class="L1" x="252" y="116" width="80" height="44"/><text class="mono" x="292" y="145" font-size="17" text-anchor="middle">3</text>
  <rect class="L1" x="372" y="116" width="80" height="44"/><text class="mono" x="412" y="145" font-size="17" text-anchor="middle">1</text>
  <rect class="L2" x="492" y="116" width="80" height="44"/><text class="mono" x="532" y="145" font-size="17" text-anchor="middle">1</text>
  <rect class="L2" x="612" y="116" width="80" height="44"/><text class="mono" x="652" y="145" font-size="17" text-anchor="middle">4</text>

  <!-- 分层括号 -->
  <path class="brk" d="M 134 172 L 134 184 L 210 184 L 210 172"/>
  <text class="mono" x="172" y="202" font-size="12" text-anchor="middle" fill="#0969da">第 0 层（起点）</text>
  <path class="brk" d="M 254 172 L 254 184 L 450 184 L 450 172"/>
  <text class="mono" x="352" y="202" font-size="12" text-anchor="middle" fill="#1a7f37">第 1 层（跳 1 次可达）</text>
  <path class="brk" d="M 494 172 L 494 184 L 690 184 L 690 172"/>
  <text class="mono" x="592" y="202" font-size="12" text-anchor="middle" fill="#bf8700">第 2 层（跳 2 次可达）</text>

  <text class="mono" x="712" y="145" font-size="13" fill="#cf222e" font-weight="600">答案 = 2</text>

  <!-- 推演表 -->
  <line x1="32" y1="226" x2="788" y2="226" stroke="#d0d7de" stroke-width="1"/>
  <text class="cap" x="32" y="252" font-size="14">逐步推演（i 只走到 n−2）</text>

  <text class="mono sub" x="60"  y="282" font-size="12.5">i</text>
  <text class="mono sub" x="150" y="282" font-size="12.5">far = max(far, i + nums[i])</text>
  <text class="mono sub" x="420" y="282" font-size="12.5">i == end ?</text>
  <text class="mono sub" x="560" y="282" font-size="12.5">动作</text>

  <line x1="52" y1="292" x2="768" y2="292" stroke="#d0d7de" stroke-width="1"/>

  <text class="mono" x="60"  y="316" font-size="12.5">0</text>
  <text class="mono" x="150" y="316" font-size="12.5">max(0, 0+2) = 2</text>
  <text class="mono" x="420" y="316" font-size="12.5" fill="#1a7f37">是（end = 0）</text>
  <text class="mono" x="560" y="316" font-size="12.5" fill="#1a7f37">ans = 1，end = 2</text>

  <text class="mono" x="60"  y="342" font-size="12.5">1</text>
  <text class="mono" x="150" y="342" font-size="12.5">max(2, 1+3) = 4</text>
  <text class="mono sub" x="420" y="342" font-size="12.5">否</text>
  <text class="mono sub" x="560" y="342" font-size="12.5">只更新 far</text>

  <text class="mono" x="60"  y="368" font-size="12.5">2</text>
  <text class="mono" x="150" y="368" font-size="12.5">max(4, 2+1) = 4</text>
  <text class="mono" x="420" y="368" font-size="12.5" fill="#1a7f37">是（end = 2）</text>
  <text class="mono" x="560" y="368" font-size="12.5" fill="#1a7f37">ans = 2，end = 4</text>

  <text class="mono" x="60"  y="394" font-size="12.5">3</text>
  <text class="mono" x="150" y="394" font-size="12.5">max(4, 3+1) = 4</text>
  <text class="mono sub" x="420" y="394" font-size="12.5">否</text>
  <text class="mono sub" x="560" y="394" font-size="12.5">只更新 far</text>

  <line class="cut" x1="52" y1="410" x2="768" y2="410"/>
  <text class="mono" x="60" y="432" font-size="12.5" fill="#cf222e">i = 4 不遍历 —— 到了终点就不用再跳了</text>
  <text class="sub" x="32" y="458" font-size="12.5">若循环写成 range(n)，当 n−1 恰好是某一层的右边界时会再触发一次结算，答案凭空多 1。这是 45 唯一的坑。</text>
</svg>
