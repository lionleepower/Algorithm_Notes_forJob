<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440">
  <defs>
    <marker id="ar54" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
    <marker id="bad54" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .cap{font-size:13px;font-weight:600;fill:#0969da}
    .c{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5;rx:4}
    .done{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5;rx:4}
    .live{fill:#ddf4ff;stroke:#0969da;stroke-width:1.8;rx:4}
    .ar{stroke:#0969da;stroke-width:2.2;fill:none;marker-end:url(#ar54)}
    .bad{stroke:#cf222e;stroke-width:2.2;fill:none;stroke-dasharray:5 4;marker-end:url(#bad54)}
  </style>

  <rect width="820" height="440" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="36">54 螺旋矩阵：四个边界围出「还没走过的矩形」，走完一条边就把那条边界推进一格</text>
  <text class="sub" x="32" y="58">状态是 top / bottom / left / right 四个数；循环条件 while top ≤ bottom and left ≤ right，每轮走四条腿。</text>

  <!-- 左：正常一圈 -->
  <text class="cap" x="60" y="98">一圈的四条腿</text>
  <g>
    <rect class="live" x="60"  y="112" width="46" height="40"/>
    <rect class="live" x="110" y="112" width="46" height="40"/>
    <rect class="live" x="160" y="112" width="46" height="40"/>
    <rect class="live" x="210" y="112" width="46" height="40"/>
    <rect class="live" x="60"  y="156" width="46" height="40"/>
    <rect class="c"    x="110" y="156" width="46" height="40"/>
    <rect class="c"    x="160" y="156" width="46" height="40"/>
    <rect class="live" x="210" y="156" width="46" height="40"/>
    <rect class="live" x="60"  y="200" width="46" height="40"/>
    <rect class="live" x="110" y="200" width="46" height="40"/>
    <rect class="live" x="160" y="200" width="46" height="40"/>
    <rect class="live" x="210" y="200" width="46" height="40"/>
  </g>
  <path class="ar" d="M 70 132 L 246 132"/>
  <path class="ar" d="M 233 142 L 233 230"/>
  <path class="ar" d="M 246 220 L 74 220"/>
  <path class="ar" d="M 83 210 L 83 146"/>
  <text class="mono sub" x="286" y="132" font-size="12">① 左→右，走完 top += 1</text>
  <text class="mono sub" x="286" y="156" font-size="12">② 上→下，走完 right −= 1</text>
  <text class="mono sub" x="286" y="180" font-size="12">③ 右→左，走完 bottom −= 1</text>
  <text class="mono sub" x="286" y="204" font-size="12">④ 下→上，走完 left += 1</text>
  <text class="mono" x="286" y="232" font-size="12" fill="#1a7f37">每条腿都用「另一维的当前边界」作为固定坐标</text>

  <line x1="32" y1="262" x2="788" y2="262" stroke="#d0d7de" stroke-width="1"/>

  <!-- 右：退化情形 -->
  <text x="32" y="288" font-size="14" font-weight="600" fill="#cf222e">为什么第 ③ ④ 条腿前必须再判一次边界</text>
  <text class="sub" x="32" y="310" font-size="12.5">走完 ① ② 之后 top 和 right 已经变了，剩下的区域可能已经空掉。单行矩阵是最小反例：</text>

  <rect class="done" x="60"  y="330" width="46" height="40"/><text class="mono" x="83"  y="356" font-size="14" text-anchor="middle" fill="#57606a">1</text>
  <rect class="done" x="110" y="330" width="46" height="40"/><text class="mono" x="133" y="356" font-size="14" text-anchor="middle" fill="#57606a">2</text>
  <rect class="done" x="160" y="330" width="46" height="40"/><text class="mono" x="183" y="356" font-size="14" text-anchor="middle" fill="#57606a">3</text>
  <rect class="done" x="210" y="330" width="46" height="40"/><text class="mono" x="233" y="356" font-size="14" text-anchor="middle" fill="#57606a">4</text>
  <path class="ar"  d="M 70 322 L 246 322"/>
  <path class="bad" d="M 246 382 L 74 382"/>
  <text class="mono" x="286" y="326" font-size="12.5" fill="#0969da">① 已走完 1 2 3 4，随后 top += 1 使 top &gt; bottom</text>
  <text class="mono" x="286" y="352" font-size="12.5" fill="#cf222e">③ 若不判断就继续往回走，会重复输出 4 3 2 1</text>
  <text class="mono sub" x="286" y="378" font-size="12.5">所以 ③ 前写 if top &lt;= bottom，④ 前写 if left &lt;= right</text>

  <text class="mono" x="32" y="418" font-size="12.5" fill="#1a7f37">另一种免判断的写法：用 while len(ans) &lt; m * n 控制，一旦凑够元素立即返回 —— 少两个 if，但要在每条腿内部检查。</text>
</svg>
