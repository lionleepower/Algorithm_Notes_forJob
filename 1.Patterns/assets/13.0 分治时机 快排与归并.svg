<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <defs>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .cap{font-size:14px;font-weight:600}
    .n{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5;rx:5}
    .work{fill:#ffebe9;stroke:#cf222e;stroke-width:2;rx:5}
    .e{stroke:#8c959f;stroke-width:1.4;fill:none}
    .flow{stroke:#cf222e;stroke-width:2.2;fill:none;marker-end:url(#arS)}
  </style>

  <rect width="820" height="470" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="36">快排与归并是同一棵递归树，区别只在「活在哪一层干」</text>
  <text class="sub" x="32" y="58">红色 = 真正做比较和搬运的地方。看懂这张图，两种排序的稳定性、空间、最坏情况就都能自己推出来。</text>

  <!-- 左：快排 -->
  <text class="cap" x="60" y="94" fill="#cf222e">快速排序：先分后治（下行时干活）</text>

  <rect class="work" x="120" y="108" width="200" height="34"/>
  <text class="mono" x="220" y="130" font-size="12.5" text-anchor="middle">partition 整段</text>
  <rect class="work" x="80"  y="176" width="110" height="30"/>
  <text class="mono" x="135" y="196" font-size="11.5" text-anchor="middle">partition 左半</text>
  <rect class="work" x="250" y="176" width="110" height="30"/>
  <text class="mono" x="305" y="196" font-size="11.5" text-anchor="middle">partition 右半</text>
  <rect class="n" x="66"  y="240" width="52" height="26"/>
  <rect class="n" x="126" y="240" width="52" height="26"/>
  <rect class="n" x="236" y="240" width="52" height="26"/>
  <rect class="n" x="296" y="240" width="52" height="26"/>
  <text class="sub" x="207" y="284" font-size="11.5" text-anchor="middle">递归到底时数组已经有序，回来什么都不做</text>

  <path class="e" d="M 180 142 L 135 176"/>
  <path class="e" d="M 260 142 L 305 176"/>
  <path class="e" d="M 115 206 L 92 240"/>
  <path class="e" d="M 155 206 L 152 240"/>
  <path class="e" d="M 285 206 L 262 240"/>
  <path class="e" d="M 325 206 L 322 240"/>
  <path class="flow" d="M 46 112 L 46 262"/>

  <line x1="400" y1="80" x2="400" y2="300" stroke="#d0d7de" stroke-width="1"/>

  <!-- 右：归并 -->
  <text class="cap" x="440" y="94" fill="#cf222e">归并排序：先治后分（上行时干活）</text>

  <rect class="n" x="500" y="108" width="200" height="34"/>
  <text class="mono sub" x="600" y="130" font-size="12.5" text-anchor="middle">只算 mid，直接下沉</text>
  <rect class="n" x="460" y="176" width="110" height="30"/>
  <rect class="n" x="630" y="176" width="110" height="30"/>
  <rect class="work" x="446" y="240" width="52" height="26"/>
  <rect class="work" x="506" y="240" width="52" height="26"/>
  <rect class="work" x="616" y="240" width="52" height="26"/>
  <rect class="work" x="676" y="240" width="52" height="26"/>
  <text class="sub" x="594" y="284" font-size="11.5" text-anchor="middle">从底往上一层层 merge，每层总代价 O(n)</text>

  <path class="e" d="M 560 142 L 515 176"/>
  <path class="e" d="M 640 142 L 685 176"/>
  <path class="e" d="M 495 206 L 472 240"/>
  <path class="e" d="M 535 206 L 532 240"/>
  <path class="e" d="M 665 206 L 642 240"/>
  <path class="e" d="M 705 206 L 702 240"/>
  <path class="flow" d="M 774 262 L 774 112"/>

  <line x1="32" y1="308" x2="788" y2="308" stroke="#d0d7de" stroke-width="1"/>

  <text class="cap" x="32" y="334">从「活在哪层」直接推出三条结论</text>

  <text class="mono" x="32" y="362" font-size="12.5" fill="#cf222e">1. 最坏情况</text>
  <text class="sub" x="150" y="362" font-size="12.5">快排的树形状由 pivot 决定，选到最小值就退化成 n 层链 ⇒ O(n²)；归并每次都对半砍，树高恒为 log n ⇒ 恒定 O(n log n)。</text>

  <text class="mono" x="32" y="390" font-size="12.5" fill="#cf222e">2. 额外空间</text>
  <text class="sub" x="150" y="390" font-size="12.5">快排在原数组上交换，只花递归栈 O(log n)；归并的 merge 无法原地，要借一个等长临时数组 O(n)。</text>

  <text class="mono" x="32" y="418" font-size="12.5" fill="#cf222e">3. 稳定性</text>
  <text class="sub" x="150" y="418" font-size="12.5">merge 里「相等时取左边」就保住了相对顺序 ⇒ 归并稳定；快排的 partition 会把远处的元素长距离交换过来 ⇒ 不稳定。</text>

  <text class="mono" x="32" y="452" font-size="12.5" fill="#0969da">堆排序不在这张图里：它不分治，是「选择排序」把每轮找最大值从 O(n) 加速到 O(log n) 的结果。</text>
</svg>
