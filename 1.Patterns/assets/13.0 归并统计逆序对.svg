<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440">
  <defs>
    <marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .cap{font-size:13px;font-weight:600;fill:#0969da}
    .L{fill:#ddf4ff;stroke:#0969da;stroke-width:1.6;rx:5}
    .R{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.6;rx:5}
    .rest{fill:#ffebe9;stroke:#cf222e;stroke-width:2.2;rx:5}
    .out{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5;rx:5}
    .ar{stroke:#cf222e;stroke-width:2;fill:none;marker-end:url(#arM)}
  </style>

  <rect width="820" height="440" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="36">归并的免费赠品：merge 的那一刻，逆序对可以顺手数出来</text>
  <text class="sub" x="32" y="58">前提是两半各自已经有序。此时「右边的元素抢先出队」这件事本身就携带了计数信息。</text>

  <!-- 两个有序半段 -->
  <text class="cap" x="130" y="102" text-anchor="end">左半（已排好）</text>
  <rect class="L" x="150" y="82" width="56" height="34"/><text class="mono" x="178" y="105" font-size="15" text-anchor="middle">2</text>
  <rect class="rest" x="212" y="82" width="56" height="34"/><text class="mono" x="240" y="105" font-size="15" text-anchor="middle">5</text>
  <rect class="rest" x="274" y="82" width="56" height="34"/><text class="mono" x="302" y="105" font-size="15" text-anchor="middle">7</text>
  <rect class="rest" x="336" y="82" width="56" height="34"/><text class="mono" x="364" y="105" font-size="15" text-anchor="middle">9</text>
  <text class="mono" x="178" y="136" font-size="12" text-anchor="middle" fill="#0969da">i</text>

  <text class="cap" x="130" y="182" text-anchor="end">右半（已排好）</text>
  <rect class="R" x="150" y="162" width="56" height="34"/><text class="mono" x="178" y="185" font-size="15" text-anchor="middle">4</text>
  <rect class="R" x="212" y="162" width="56" height="34"/><text class="mono" x="240" y="185" font-size="15" text-anchor="middle">6</text>
  <rect class="R" x="274" y="162" width="56" height="34"/><text class="mono" x="302" y="185" font-size="15" text-anchor="middle">8</text>
  <text class="mono" x="240" y="216" font-size="12" text-anchor="middle" fill="#1a7f37">j</text>

  <path class="ar" d="M 268 158 L 268 128"/>

  <text class="mono" x="430" y="100" font-size="13" fill="#cf222e" font-weight="600">此刻 nums[j] = 6 &lt; nums[i] = 7，右边先出队</text>
  <text class="sub" x="430" y="126" font-size="12.5">左半剩下的 <tspan class="mono" fill="#cf222e">5, 7, 9</tspan> 全都在原数组里排在 6 前面，</text>
  <text class="sub" x="430" y="148" font-size="12.5">又全都大于 6 ⇒ 一次性贡献 <tspan class="mono" fill="#cf222e">mid − i + 1 = 3</tspan> 个逆序对。</text>
  <text class="sub" x="430" y="176" font-size="12.5">左半有序保证了「只要 nums[i] 大，它后面的都大」，</text>
  <text class="sub" x="430" y="198" font-size="12.5">所以能整段计数，而不是一个个数 —— 这是省下那层循环的原因。</text>

  <!-- 合并结果 -->
  <text class="cap" x="130" y="266" text-anchor="end">merge 输出</text>
  <rect class="out" x="150" y="246" width="56" height="34"/><text class="mono" x="178" y="269" font-size="15" text-anchor="middle">2</text>
  <rect class="out" x="212" y="246" width="56" height="34"/><text class="mono" x="240" y="269" font-size="15" text-anchor="middle">4</text>
  <rect class="out" x="274" y="246" width="56" height="34"/><text class="mono" x="302" y="269" font-size="15" text-anchor="middle">5</text>
  <rect class="out" x="336" y="246" width="56" height="34"/><text class="mono" x="364" y="269" font-size="15" text-anchor="middle">6</text>
  <rect class="out" x="398" y="246" width="56" height="34"/><text class="mono" x="426" y="269" font-size="15" text-anchor="middle">7</text>
  <rect class="out" x="460" y="246" width="56" height="34"/><text class="mono" x="488" y="269" font-size="15" text-anchor="middle">8</text>
  <rect class="out" x="522" y="246" width="56" height="34"/><text class="mono" x="550" y="269" font-size="15" text-anchor="middle">9</text>

  <line x1="32" y1="304" x2="788" y2="304" stroke="#d0d7de" stroke-width="1"/>

  <text class="mono" x="32" y="332" font-size="12.5" fill="#0969da">while i &lt;= mid and j &lt;= r:</text>
  <text class="mono" x="32" y="354" font-size="12.5" fill="#0969da">　　if a[i] &lt;= a[j]: tmp.append(a[i]); i += 1　　　　# 取等号才稳定</text>
  <text class="mono" x="32" y="376" font-size="12.5" fill="#cf222e">　　else:            tmp.append(a[j]); j += 1; cnt += mid - i + 1</text>

  <text class="sub" x="32" y="408" font-size="12.5">同一行代码换个统计量就能解别的题：493 翻转对（条件改成 a[i] &gt; 2·a[j]，需要单独一趟双指针）、剑指 51 逆序对、315 计算右侧小于当前元素的个数（把下标一起带着归并）。</text>
  <text class="sub" x="32" y="430" font-size="12.5">稳定性也藏在这里：<tspan class="mono">a[i] &lt;= a[j]</tspan> 的等号让左半（原数组里靠前）优先出队；写成 <tspan class="mono" fill="#cf222e">&lt;</tspan> 就不稳定了。</text>
</svg>
