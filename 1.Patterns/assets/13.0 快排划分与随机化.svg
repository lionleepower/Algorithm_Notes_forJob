<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <defs>
    <marker id="arQ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .cap{font-size:13px;font-weight:600;fill:#0969da}
    .c{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5;rx:5}
    .lt{fill:#ddf4ff;stroke:#0969da;stroke-width:1.6;rx:5}
    .eq{fill:#fff8c5;stroke:#bf8700;stroke-width:1.8;rx:5}
    .gt{fill:#ffebe9;stroke:#cf222e;stroke-width:1.6;rx:5}
    .unk{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.4;stroke-dasharray:4 3;rx:5}
    .ar{stroke:#0969da;stroke-width:1.8;fill:none;marker-end:url(#arQ)}
  </style>

  <rect width="820" height="470" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="36">快排的两个考点：三路划分的循环不变量，和为什么必须随机化</text>

  <!-- 三路划分不变量 -->
  <text class="cap" x="32" y="72">三路划分（荷兰国旗）：任意时刻数组被三个游标切成四段</text>

  <rect class="lt"  x="60"  y="88" width="150" height="40"/>
  <text class="mono" x="135" y="113" font-size="13" text-anchor="middle" fill="#0969da">&lt; pivot</text>
  <rect class="eq"  x="212" y="88" width="150" height="40"/>
  <text class="mono" x="287" y="113" font-size="13" text-anchor="middle" fill="#bf8700">== pivot</text>
  <rect class="unk" x="364" y="88" width="230" height="40"/>
  <text class="mono sub" x="479" y="113" font-size="13" text-anchor="middle">未处理</text>
  <rect class="gt"  x="596" y="88" width="164" height="40"/>
  <text class="mono" x="678" y="113" font-size="13" text-anchor="middle" fill="#cf222e">&gt; pivot</text>

  <text class="mono" x="212" y="148" font-size="12" text-anchor="middle" fill="#0969da">lt</text>
  <text class="mono" x="364" y="148" font-size="12" text-anchor="middle" fill="#0969da">i</text>
  <text class="mono" x="596" y="148" font-size="12" text-anchor="middle" fill="#0969da">gt</text>

  <text class="mono sub" x="60" y="176" font-size="12">x &lt; pivot ⇒ swap(i, lt); lt += 1; i += 1　　x == pivot ⇒ i += 1　　x &gt; pivot ⇒ swap(i, gt); gt −= 1（<tspan fill="#cf222e">i 不动！</tspan>）</text>
  <text class="sub" x="60" y="198" font-size="12.5">最后一条是唯一的坑：从右边换过来的元素还没被看过，i 前进就等于跳过了它。</text>

  <line x1="32" y1="220" x2="788" y2="220" stroke="#d0d7de" stroke-width="1"/>

  <!-- 随机化 -->
  <text class="cap" x="32" y="248" font-size="14">为什么不随机化就会被卡：有序数组是快排的死穴</text>

  <text class="mono sub" x="150" y="286" font-size="12.5" text-anchor="end">输入 [1,2,3,4,5]</text>
  <text class="mono sub" x="150" y="308" font-size="12.5" text-anchor="end">固定取首元素当 pivot</text>

  <rect class="eq" x="170" y="270" width="46" height="30"/><text class="mono" x="193" y="291" font-size="13" text-anchor="middle">1</text>
  <rect class="c"  x="220" y="270" width="46" height="30"/><text class="mono" x="243" y="291" font-size="13" text-anchor="middle">2</text>
  <rect class="c"  x="270" y="270" width="46" height="30"/><text class="mono" x="293" y="291" font-size="13" text-anchor="middle">3</text>
  <rect class="c"  x="320" y="270" width="46" height="30"/><text class="mono" x="343" y="291" font-size="13" text-anchor="middle">4</text>
  <rect class="c"  x="370" y="270" width="46" height="30"/><text class="mono" x="393" y="291" font-size="13" text-anchor="middle">5</text>

  <path class="ar" d="M 240 306 L 240 322"/>
  <rect class="eq" x="220" y="326" width="46" height="30"/><text class="mono" x="243" y="347" font-size="13" text-anchor="middle">2</text>
  <rect class="c"  x="270" y="326" width="46" height="30"/><text class="mono" x="293" y="347" font-size="13" text-anchor="middle">3</text>
  <rect class="c"  x="320" y="326" width="46" height="30"/><text class="mono" x="343" y="347" font-size="13" text-anchor="middle">4</text>
  <rect class="c"  x="370" y="326" width="46" height="30"/><text class="mono" x="393" y="347" font-size="13" text-anchor="middle">5</text>

  <path class="ar" d="M 290 362 L 290 378"/>
  <rect class="eq" x="270" y="382" width="46" height="30"/><text class="mono" x="293" y="403" font-size="13" text-anchor="middle">3</text>
  <rect class="c"  x="320" y="382" width="46" height="30"/><text class="mono" x="343" y="403" font-size="13" text-anchor="middle">4</text>
  <rect class="c"  x="370" y="382" width="46" height="30"/><text class="mono" x="393" y="403" font-size="13" text-anchor="middle">5</text>

  <text class="mono" x="446" y="291" font-size="12.5" fill="#cf222e">每次只切掉 1 个元素</text>
  <text class="mono" x="446" y="347" font-size="12.5" fill="#cf222e">递归深度 = n，不是 log n</text>
  <text class="mono" x="446" y="403" font-size="12.5" fill="#cf222e">时间 O(n²)，还可能爆栈</text>

  <text class="sub" x="32" y="440" font-size="12.5">修法：<tspan class="mono">i = random.randint(l, r); nums[l], nums[i] = nums[i], nums[l]</tspan> —— 随机 pivot 把「最坏输入」变成「最坏运气」，期望仍是 O(n log n)。</text>
  <text class="sub" x="32" y="460" font-size="12.5">LeetCode 912 的测试数据里就有有序和全等数组，不随机化 + 不三路划分会直接超时。这也是面试官最爱追问的一条。</text>
</svg>
