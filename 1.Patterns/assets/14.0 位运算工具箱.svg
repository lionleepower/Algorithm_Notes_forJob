<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="820" height="450">
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace;letter-spacing:2px}
    .m2{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .cap{font-size:14px;font-weight:600;fill:#0969da}
    .hi{fill:#ffebe9;stroke:#cf222e;stroke-width:2;rx:4}
    .keep{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.6;rx:4}
    .box{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5;rx:8}
  </style>

  <rect width="820" height="450" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="36">两个必须背下来的恒等式：x &amp; (x−1) 去掉最低位的 1，x &amp; (−x) 只留最低位的 1</text>
  <text class="sub" x="32" y="58">以 x = 88 = 0b01011000 为例。理解的关键是「减 1 会把最低位的 1 变成 0、并把它右边全部变成 1」。</text>

  <!-- 左：x & (x-1) -->
  <rect class="box" x="32" y="78" width="368" height="196"/>
  <text class="cap" x="52" y="104">x &amp; (x − 1)：清掉最低位的 1</text>

  <rect class="hi" x="252" y="116" width="26" height="24"/>
  <text class="m2 sub" x="150" y="134" font-size="12.5" text-anchor="end">x</text>
  <text class="mono" x="160" y="134" font-size="15">0 1 0 1 1 0 0 0</text>

  <text class="m2 sub" x="150" y="164" font-size="12.5" text-anchor="end">x − 1</text>
  <text class="mono" x="160" y="164" font-size="15">0 1 0 1 0 1 1 1</text>
  <text class="m2 sub" x="292" y="164" font-size="11">最低位的 1 变 0，右边全变 1</text>

  <line x1="150" y1="178" x2="300" y2="178" stroke="#57606a" stroke-width="1.2"/>
  <text class="m2 sub" x="150" y="200" font-size="12.5" text-anchor="end">&amp;</text>
  <text class="mono" x="160" y="200" font-size="15" fill="#1a7f37">0 1 0 1 0 0 0 0</text>

  <text class="sub" x="52" y="230" font-size="12.5">相与之后：最低位的 1 及其右边全部归零，</text>
  <text class="sub" x="52" y="250" font-size="12.5">更高位原样保留。</text>
  <text class="m2" x="52" y="268" font-size="12.5" fill="#0969da">⇒ 数 1 的个数：while x: x &amp;= x − 1; cnt += 1</text>

  <!-- 右：x & (-x) -->
  <rect class="box" x="420" y="78" width="368" height="196"/>
  <text class="cap" x="440" y="104">x &amp; (−x)：只留最低位的 1（lowbit）</text>

  <text class="m2 sub" x="538" y="134" font-size="12.5" text-anchor="end">x</text>
  <text class="mono" x="548" y="134" font-size="15">0 1 0 1 1 0 0 0</text>

  <text class="m2 sub" x="538" y="164" font-size="12.5" text-anchor="end">−x</text>
  <text class="mono" x="548" y="164" font-size="15">1 0 1 0 1 0 0 0</text>
  <text class="m2 sub" x="680" y="184" font-size="11">补码：−x = ~x + 1</text>

  <line x1="538" y1="178" x2="688" y2="178" stroke="#57606a" stroke-width="1.2"/>
  <text class="m2 sub" x="538" y="200" font-size="12.5" text-anchor="end">&amp;</text>
  <text class="mono" x="548" y="200" font-size="15" fill="#cf222e">0 0 0 0 1 0 0 0</text>

  <text class="sub" x="440" y="230" font-size="12.5">取反后最低位 1 右边仍是 0，加 1 只影响到</text>
  <text class="sub" x="440" y="250" font-size="12.5">那一位 ⇒ 只有它和 x 同为 1。</text>
  <text class="m2" x="440" y="268" font-size="12.5" fill="#0969da">⇒ 树状数组、260 分组、状压枚举都靠它</text>

  <line x1="32" y1="292" x2="788" y2="292" stroke="#d0d7de" stroke-width="1"/>

  <text class="cap" x="32" y="318" font-size="14">其余高频写法</text>

  <text class="m2" x="52"  y="346" font-size="12.5" fill="#0969da">x &gt;&gt; i &amp; 1</text>
  <text class="sub" x="200" y="346" font-size="12.5">取第 i 位（<tspan fill="#cf222e">注意优先级：&amp; 比 == 还低，写 if x &gt;&gt; i &amp; 1 == 1 会被解析成 x &gt;&gt; i &amp; (1==1)</tspan>）</text>

  <text class="m2" x="52"  y="372" font-size="12.5" fill="#0969da">x | (1 &lt;&lt; i)　x &amp; ~(1 &lt;&lt; i)　x ^ (1 &lt;&lt; i)</text>
  <text class="sub" x="380" y="372" font-size="12.5">置 1 / 清 0 / 翻转第 i 位</text>

  <text class="m2" x="52"  y="398" font-size="12.5" fill="#0969da">n &gt; 0 and n &amp; (n − 1) == 0</text>
  <text class="sub" x="380" y="398" font-size="12.5">判断是不是 2 的幂（二进制里只有一个 1）</text>

  <text class="m2" x="52"  y="424" font-size="12.5" fill="#0969da">s = mask; while s: ... ; s = (s − 1) &amp; mask</text>
  <text class="sub" x="380" y="424" font-size="12.5">枚举 mask 的所有非空子集（状压 DP 的入场券）</text>
</svg>
