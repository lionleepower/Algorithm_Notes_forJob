<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <defs>
    <marker id="arX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .cap{font-size:13px;font-weight:600;fill:#0969da}
    .c{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5;rx:5}
    .g0{fill:#ddf4ff;stroke:#0969da;stroke-width:1.8;rx:5}
    .g1{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.8;rx:5}
    .key{fill:#ffebe9;stroke:#cf222e;stroke-width:2.2;rx:5}
    .ar{stroke:#0969da;stroke-width:1.8;fill:none;marker-end:url(#arX)}
  </style>

  <rect width="820" height="470" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="36">260 的全部难点：异或完只剩 a ^ b，怎么把 a 和 b 拆开？</text>
  <text class="mono sub" x="32" y="58">nums = [1, 2, 1, 3, 2, 5]，其中 3 和 5 各出现一次，其余成对。异或三性质：a^a = 0，a^0 = a，可交换可结合。</text>

  <!-- 第一步 -->
  <text class="cap" x="32" y="96">① 全部异或：成对的自相抵消，只剩两个答案的异或值</text>

  <rect class="c" x="60"  y="110" width="52" height="34"/><text class="mono" x="86"  y="133" font-size="15" text-anchor="middle">1</text>
  <rect class="c" x="118" y="110" width="52" height="34"/><text class="mono" x="144" y="133" font-size="15" text-anchor="middle">2</text>
  <rect class="c" x="176" y="110" width="52" height="34"/><text class="mono" x="202" y="133" font-size="15" text-anchor="middle">1</text>
  <rect class="key" x="234" y="110" width="52" height="34"/><text class="mono" x="260" y="133" font-size="15" text-anchor="middle" fill="#cf222e">3</text>
  <rect class="c" x="292" y="110" width="52" height="34"/><text class="mono" x="318" y="133" font-size="15" text-anchor="middle">2</text>
  <rect class="key" x="350" y="110" width="52" height="34"/><text class="mono" x="376" y="133" font-size="15" text-anchor="middle" fill="#cf222e">5</text>

  <text class="mono" x="430" y="133" font-size="14" fill="#0969da">全部 ^ ⇒ 3 ^ 5 = 6 = 0b110</text>

  <!-- 第二步 -->
  <text class="cap" x="32" y="188">② 取 lowbit：a ^ b 里任何一个 1，都是 a 和 b「在这一位不同」的证据</text>

  <text class="mono sub" x="180" y="216" font-size="13" text-anchor="end">3 =</text>
  <text class="mono" x="192" y="216" font-size="15" letter-spacing="4">0 1 1</text>
  <text class="mono sub" x="180" y="240" font-size="13" text-anchor="end">5 =</text>
  <text class="mono" x="192" y="240" font-size="15" letter-spacing="4">1 0 1</text>
  <line x1="180" y1="250" x2="272" y2="250" stroke="#57606a" stroke-width="1.2"/>
  <text class="mono sub" x="180" y="270" font-size="13" text-anchor="end">^ =</text>
  <text class="mono" x="192" y="270" font-size="15" letter-spacing="4" fill="#cf222e">1 1 0</text>

  <text class="mono" x="300" y="240" font-size="13" fill="#cf222e">lowbit = 6 &amp; (−6) = 0b010 = 2</text>
  <text class="sub" x="300" y="264" font-size="12.5">这一位上 3 是 1、5 是 0 —— 它们必然被分到不同组。</text>
  <text class="sub" x="300" y="286" font-size="12.5">取哪个 1 都行，取 lowbit 只是因为它一行就能写出来。</text>

  <!-- 第三步 -->
  <text class="cap" x="32" y="326">③ 按这一位分成两组，每组都退化成 136（一个落单 + 若干成对）</text>

  <text class="mono sub" x="150" y="366" font-size="12.5" text-anchor="end">该位为 0：</text>
  <rect class="g0" x="160" y="348" width="52" height="30"/><text class="mono" x="186" y="369" font-size="14" text-anchor="middle">1</text>
  <rect class="g0" x="218" y="348" width="52" height="30"/><text class="mono" x="244" y="369" font-size="14" text-anchor="middle">1</text>
  <rect class="g0" x="276" y="348" width="52" height="30"/><text class="mono" x="302" y="369" font-size="14" text-anchor="middle">5</text>
  <text class="mono" x="348" y="369" font-size="13.5" fill="#0969da">全部 ^ ⇒ 5</text>

  <text class="mono sub" x="150" y="410" font-size="12.5" text-anchor="end">该位为 1：</text>
  <rect class="g1" x="160" y="392" width="52" height="30"/><text class="mono" x="186" y="413" font-size="14" text-anchor="middle">2</text>
  <rect class="g1" x="218" y="392" width="52" height="30"/><text class="mono" x="244" y="413" font-size="14" text-anchor="middle">3</text>
  <rect class="g1" x="276" y="392" width="52" height="30"/><text class="mono" x="302" y="413" font-size="14" text-anchor="middle">2</text>
  <text class="mono" x="348" y="413" font-size="13.5" fill="#1a7f37">全部 ^ ⇒ 3</text>

  <text class="sub" x="470" y="369" font-size="12.5">成对的两个数每一位都相同，</text>
  <text class="sub" x="470" y="391" font-size="12.5">必定进同一组、继续互相抵消；</text>
  <text class="sub" x="470" y="413" font-size="12.5">这是分组不会破坏配对的原因。</text>

  <text class="mono" x="32" y="452" font-size="13" fill="#cf222e">答案 = [5, 3]　　时间 O(n)，空间 O(1) —— 两遍遍历，不需要哈希表。</text>
</svg>
