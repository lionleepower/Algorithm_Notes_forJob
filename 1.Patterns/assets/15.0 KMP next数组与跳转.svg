<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <defs>
    <marker id="arK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .cap{font-size:13px;font-weight:600;fill:#0969da}
    .c{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5;rx:4}
    .ok{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.8;rx:4}
    .bad{fill:#ffebe9;stroke:#cf222e;stroke-width:2.2;rx:4}
    .pre{fill:#ddf4ff;stroke:#0969da;stroke-width:2;rx:4}
    .ar{stroke:#0969da;stroke-width:2;fill:none;marker-end:url(#arK)}
  </style>

  <rect width="820" height="470" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="36">KMP：失配时不要回退文本指针，让模式串「滑到自己的最长相等前后缀」</text>
  <text class="mono sub" x="32" y="58">nxt[i] = p[0..i] 的最长「相等真前后缀」长度（真 = 不能是整个串自己）</text>

  <!-- next 表 -->
  <text class="cap" x="32" y="94">① 先看 next 数组是什么</text>
  <text class="mono sub" x="140" y="126" font-size="12.5" text-anchor="end">p</text>
  <g class="mono" font-size="15" text-anchor="middle">
    <rect class="c" x="150" y="106" width="46" height="30"/><text x="173" y="127">a</text>
    <rect class="c" x="202" y="106" width="46" height="30"/><text x="225" y="127">b</text>
    <rect class="c" x="254" y="106" width="46" height="30"/><text x="277" y="127">a</text>
    <rect class="c" x="306" y="106" width="46" height="30"/><text x="329" y="127">b</text>
    <rect class="c" x="358" y="106" width="46" height="30"/><text x="381" y="127">a</text>
    <rect class="c" x="410" y="106" width="46" height="30"/><text x="433" y="127">c</text>
    <rect class="c" x="462" y="106" width="46" height="30"/><text x="485" y="127">a</text>
  </g>
  <text class="mono sub" x="140" y="160" font-size="12.5" text-anchor="end">nxt</text>
  <g class="mono" font-size="14" text-anchor="middle" fill="#0969da">
    <text x="173" y="160">0</text><text x="225" y="160">0</text><text x="277" y="160">1</text>
    <text x="329" y="160">2</text><text x="381" y="160">3</text><text x="433" y="160">0</text><text x="485" y="160">1</text>
  </g>
  <text class="mono sub" x="530" y="127" font-size="12">nxt[4] = 3：p[0..4] = "ababa"</text>
  <text class="mono sub" x="530" y="147" font-size="12">前缀 "aba" == 后缀 "aba"</text>
  <text class="mono sub" x="530" y="167" font-size="12">求 nxt 就是「模式串和自己匹配」</text>

  <line x1="32" y1="188" x2="788" y2="188" stroke="#d0d7de" stroke-width="1"/>

  <!-- 失配跳转 -->
  <text class="cap" x="32" y="214">② 失配的那一刻</text>

  <text class="mono sub" x="140" y="248" font-size="12.5" text-anchor="end">文本 s</text>
  <g class="mono" font-size="15" text-anchor="middle">
    <rect class="ok"  x="150" y="228" width="46" height="30"/><text x="173" y="249">a</text>
    <rect class="ok"  x="202" y="228" width="46" height="30"/><text x="225" y="249">b</text>
    <rect class="ok"  x="254" y="228" width="46" height="30"/><text x="277" y="249">a</text>
    <rect class="ok"  x="306" y="228" width="46" height="30"/><text x="329" y="249">b</text>
    <rect class="ok"  x="358" y="228" width="46" height="30"/><text x="381" y="249">a</text>
    <rect class="bad" x="410" y="228" width="46" height="30"/><text x="433" y="249" fill="#cf222e">b</text>
    <rect class="c"   x="462" y="228" width="46" height="30"/><text x="485" y="249">c</text>
    <rect class="c"   x="514" y="228" width="46" height="30"/><text x="537" y="249">a</text>
  </g>

  <text class="mono sub" x="140" y="292" font-size="12.5" text-anchor="end">模式 p</text>
  <g class="mono" font-size="15" text-anchor="middle">
    <rect class="pre" x="150" y="272" width="46" height="30"/><text x="173" y="293">a</text>
    <rect class="pre" x="202" y="272" width="46" height="30"/><text x="225" y="293">b</text>
    <rect class="pre" x="254" y="272" width="46" height="30"/><text x="277" y="293">a</text>
    <rect class="ok"  x="306" y="272" width="46" height="30"/><text x="329" y="293">b</text>
    <rect class="ok"  x="358" y="272" width="46" height="30"/><text x="381" y="293">a</text>
    <rect class="bad" x="410" y="272" width="46" height="30"/><text x="433" y="293" fill="#cf222e">c</text>
    <rect class="c"   x="462" y="272" width="46" height="30"/><text x="485" y="293">a</text>
  </g>
  <text class="mono" x="580" y="270" font-size="12.5" fill="#cf222e">在 j = 5 处失配</text>
  <text class="mono sub" x="580" y="292" font-size="12">已匹配 "ababa"，取 nxt[4] = 3</text>

  <!-- 滑动后 -->
  <text class="mono sub" x="140" y="374" font-size="12.5" text-anchor="end">p 滑动后</text>
  <g class="mono" font-size="15" text-anchor="middle">
    <rect class="pre" x="254" y="354" width="46" height="30"/><text x="277" y="375">a</text>
    <rect class="pre" x="306" y="354" width="46" height="30"/><text x="329" y="375">b</text>
    <rect class="pre" x="358" y="354" width="46" height="30"/><text x="381" y="375">a</text>
    <rect class="c"   x="410" y="354" width="46" height="30"/><text x="433" y="375">b</text>
    <rect class="c"   x="462" y="354" width="46" height="30"/><text x="485" y="375">a</text>
    <rect class="c"   x="514" y="354" width="46" height="30"/><text x="537" y="375">c</text>
    <rect class="c"   x="566" y="354" width="46" height="30"/><text x="589" y="375">a</text>
  </g>
  <path class="ar" d="M 196 320 L 300 348"/>
  <text class="mono" x="200" y="340" font-size="12" fill="#0969da">前缀 "aba" 直接对齐到刚匹配过的后缀 "aba"</text>

  <text class="mono" x="628" y="375" font-size="12.5" fill="#1a7f37">i 不回退，j = 3 继续比</text>

  <line x1="32" y1="398" x2="788" y2="398" stroke="#d0d7de" stroke-width="1"/>

  <text class="sub" x="32" y="424" font-size="12.5"><tspan font-weight="600">为什么可以这样跳</tspan>：已匹配的 "ababa" 里，后缀 "aba" 和前缀 "aba" 相同 —— 那么把模式串的前缀挪到这段后缀上，前 3 个字符<tspan font-weight="600">保证已经匹配</tspan>，不必重比。</text>
  <text class="sub" x="32" y="448" font-size="12.5">中间被跳过的所有对齐位置都不可能成功，因为它们要求一个更长的相等前后缀，而 nxt 已经取到了最长值。文本指针 i 全程只前进 ⇒ 总复杂度 O(n + m)。</text>
</svg>
