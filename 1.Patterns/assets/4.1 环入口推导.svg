<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430">
  <defs>
    <marker id="a42" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="b42" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
    <marker id="g42" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .tail{stroke:#57606a;stroke-width:2.2;fill:none;marker-end:url(#a42)}
    .arcb{stroke:#0969da;stroke-width:3;fill:none;marker-end:url(#b42)}
    .arcc{stroke:#1a7f37;stroke-width:3;fill:none;marker-end:url(#g42)}
  </style>

  <rect width="800" height="430" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="34">142 找环入口：为什么第二次相遇一定在入口</text>
  <text class="sub" x="32" y="56">a = head → 入口，b = 入口 → 相遇点（按行进方向），c = 相遇点 → 入口，环长 = b + c</text>

  <!-- 直线段 a -->
  <circle cx="70" cy="212" r="6" fill="#57606a"/>
  <text class="mono sub" x="70" y="244" font-size="13" text-anchor="middle">head</text>
  <line class="tail" x1="76" y1="212" x2="396" y2="212"/>
  <text class="mono" x="236" y="198" font-size="16" font-weight="600" fill="#57606a" text-anchor="middle">a</text>

  <!-- 环 -->
  <path class="arcb" d="M 410 212 A 80 80 0 1 1 530 281"/>
  <path class="arcc" d="M 530 281 A 80 80 0 0 1 410 212"/>

  <circle cx="410" cy="212" r="7" fill="#cf222e"/>
  <text x="400" y="190" font-size="14" font-weight="600" fill="#cf222e" text-anchor="end">入口</text>

  <circle cx="530" cy="281" r="7" fill="#8250df"/>
  <text x="552" y="304" font-size="14" font-weight="600" fill="#8250df">相遇点</text>

  <text x="588" y="152" font-size="18" font-weight="600" fill="#0969da">b</text>
  <text x="446" y="308" font-size="18" font-weight="600" fill="#1a7f37">c</text>

  <!-- 底部推导 -->
  <line x1="32" y1="330" x2="768" y2="330" stroke="#d0d7de" stroke-width="1"/>
  <text class="mono" x="32" y="356" font-size="13">相遇时 slow 走了 a + b，fast 走了 2(a + b)，两者相差 k 圈：　2(a + b) = (a + b) + k(b + c)</text>
  <text class="mono" x="32" y="380" font-size="13" fill="#0969da">⇒　a + b = k(b + c)　⇒　a = (k - 1)(b + c) + c</text>
  <text class="sub" x="32" y="404" font-size="13">读法：从 head 走 a 步、从相遇点走 c 步，落点相同 —— 两者只差整数个环长。所以两个指针同速走，必在入口相遇。</text>
  <text class="sub" x="32" y="424" font-size="12" fill="#cf222e">注意：a 不一定是环长的整数倍，说成「a 是环长倍数」只在 k = 1 且 c = 0 时才对。</text>
</svg>
