<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2328"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .sm{font-size:12px;fill:#57606a}
    .box{fill:#ffffff;stroke:#1f2328;stroke-width:1.6}
    .blue{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
    .red{fill:#ffebe9;stroke:#cf222e;stroke-width:2}
    .yel{fill:#fff8c5;stroke:#bf8700;stroke-width:2}
    .grn{fill:#dafbe1;stroke:#1a7f37;stroke-width:2}
    .dash{fill:none;stroke:#8c959f;stroke-width:1.6;stroke-dasharray:5 3}
    .lnk{stroke:#1f2328;stroke-width:1.8;fill:none;marker-end:url(#ar)}
    .lnkb{stroke:#0969da;stroke-width:2;fill:none;marker-end:url(#arb)}
    .lnkr{stroke:#cf222e;stroke-width:2;fill:none;marker-end:url(#arr)}
    .thin{stroke:#8c959f;stroke-width:1.4;fill:none}
  </style>
  <rect width="800" height="400" fill="#fbfbfd" rx="10"/>
  <text class="ttl" x="32" y="36">LRU：哈希表负责 O(1) 找节点，双向链表负责 O(1) 调整顺序</text>
  <text class="sub" x="32" y="58">链表头 = 最近使用，链表尾 = 最久未用；哈希表的值直接指向链表节点</text>
  <text class="sub" x="32" y="100" style="font-weight:600;">双向链表</text>
  <rect class="dash" x="70" y="114" width="80" height="44" rx="6"/>
  <text class="mono" x="110.0" y="141.0" text-anchor="middle" style="font-size:14px;">head</text>
  <rect class="yel" x="210" y="114" width="80" height="44" rx="6"/>
  <text class="mono" x="250.0" y="141.0" text-anchor="middle" style="font-size:14px;">3:c</text>
  <rect class="box" x="350" y="114" width="80" height="44" rx="6"/>
  <text class="mono" x="390.0" y="141.0" text-anchor="middle" style="font-size:14px;">1:a</text>
  <rect class="box" x="490" y="114" width="80" height="44" rx="6"/>
  <text class="mono" x="530.0" y="141.0" text-anchor="middle" style="font-size:14px;">2:b</text>
  <rect class="dash" x="630" y="114" width="80" height="44" rx="6"/>
  <text class="mono" x="670.0" y="141.0" text-anchor="middle" style="font-size:14px;">tail</text>
  <path class="lnk" d="M 150 128 L 210 128"/>
  <path class="lnk" d="M 210 144 L 150 144"/>
  <path class="lnk" d="M 290 128 L 350 128"/>
  <path class="lnk" d="M 350 144 L 290 144"/>
  <path class="lnk" d="M 430 128 L 490 128"/>
  <path class="lnk" d="M 490 144 L 430 144"/>
  <path class="lnk" d="M 570 128 L 630 128"/>
  <path class="lnk" d="M 630 144 L 570 144"/>
  <text class="sm" x="250" y="106" text-anchor="middle" style="fill:#bf8700;">最近使用</text>
  <text class="sm" x="530" y="106" text-anchor="middle" style="fill:#cf222e;">最久未用</text>
  <text class="sub" x="32" y="218" style="font-weight:600;">哈希表</text>
  <rect class="box" x="215" y="232" width="70" height="34" rx="6"/>
  <text class="mono" x="250.0" y="254.0" text-anchor="middle" style="font-size:13px;">key 3</text>
  <path class="lnkb" d="M 250 232 L 250 162"/>
  <rect class="box" x="355" y="232" width="70" height="34" rx="6"/>
  <text class="mono" x="390.0" y="254.0" text-anchor="middle" style="font-size:13px;">key 1</text>
  <path class="lnkb" d="M 390 232 L 390 162"/>
  <rect class="box" x="495" y="232" width="70" height="34" rx="6"/>
  <text class="mono" x="530.0" y="254.0" text-anchor="middle" style="font-size:13px;">key 2</text>
  <path class="lnkb" d="M 530 232 L 530 162"/>
  <text class="sm" x="670" y="252" text-anchor="middle">← 按 key 直接跳到节点</text>
  <rect class="blue" x="32" y="292" width="344" height="88" rx="10"/>
  <text class="mono" x="48" y="316" style="font-size:14px;font-weight:600;">get(key)</text>
  <text class="sub" x="48" y="338">哈希表找到节点 → 摘下来 → 插到 head 后面</text>
  <text class="sub" x="48" y="358">找不到就返回 -1</text>
  <rect class="red" x="396" y="292" width="372" height="88" rx="10"/>
  <text class="mono" x="412" y="316" style="font-size:14px;font-weight:600;">put(key, value) 且已满</text>
  <text class="sub" x="412" y="338">新节点插到 head 后面；超过容量就删 tail 前一个</text>
  <text class="sub" x="412" y="358">同时从哈希表里删掉它的 key（别忘了）</text>
</svg>
