<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .node{fill:#ffffff;stroke:#1f2328;stroke-width:1.8}
    .leaf{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
    .cut{fill:#ffebe9;stroke:#cf222e;stroke-width:2;stroke-dasharray:5 3}
    .edge{stroke:#8c959f;stroke-width:1.6;fill:none}
    .edge.red{stroke:#cf222e;stroke-dasharray:5 3}
    .lab{font-size:12px;fill:#57606a}
    .box{fill:#fff8c5;stroke:#bf8700;stroke-width:1.6}
  </style>
  <rect width="800" height="440" fill="#fbfbfd" rx="10"/>
  <text class="ttl" x="32" y="36">回溯 = 把嵌套 for 摊成一棵递归树，再沿着它走一遍</text>
  <text class="sub" x="32" y="58">每个节点是一次 dfs 调用；每条边是一次「选择」；沿边往下走要「做」，往回走要「撤销」</text>

  <!-- 边 -->
  <path class="edge" d="M 330 118 L 190 182"/>
  <path class="edge" d="M 350 118 L 350 182"/>
  <path class="edge" d="M 370 118 L 510 182"/>
  <path class="edge" d="M 170 218 L 110 282"/>
  <path class="edge" d="M 210 218 L 250 282"/>
  <path class="edge" d="M 360 218 L 410 282"/>
  <text class="lab" x="236" y="140" text-anchor="middle">选 a</text>
  <text class="lab" x="362" y="150" text-anchor="start">选 b</text>
  <text class="lab" x="456" y="140" text-anchor="middle">选 c</text>

  <!-- 节点 -->
  <rect class="node" x="290" y="90" width="120" height="30" rx="7"/>
  <text class="mono" x="350" y="110" font-size="13" text-anchor="middle">dfs(0)  path=[]</text>

  <rect class="node" x="130" y="186" width="120" height="30" rx="7"/>
  <text class="mono" x="190" y="206" font-size="13" text-anchor="middle">path=[a]</text>
  <rect class="node" x="290" y="186" width="120" height="30" rx="7"/>
  <text class="mono" x="350" y="206" font-size="13" text-anchor="middle">path=[b]</text>
  <rect class="cut" x="450" y="186" width="120" height="30" rx="7"/>
  <text class="mono" x="510" y="206" font-size="13" text-anchor="middle">path=[c]</text>

  <rect class="leaf" x="40" y="286" width="110" height="30" rx="7"/>
  <text class="mono" x="95" y="306" font-size="13" text-anchor="middle">[a, b]</text>
  <rect class="leaf" x="200" y="286" width="110" height="30" rx="7"/>
  <text class="mono" x="255" y="306" font-size="13" text-anchor="middle">[a, c]</text>
  <rect class="leaf" x="360" y="286" width="110" height="30" rx="7"/>
  <text class="mono" x="415" y="306" font-size="13" text-anchor="middle">[b, c]</text>


  <text class="lab" x="200" y="340" text-anchor="middle" style="fill:#0969da">叶子：凑够了，收答案</text>
  <text class="lab" x="415" y="340" text-anchor="middle" style="fill:#0969da">叶子：凑够了，收答案</text>
  <!-- 剪枝标注 -->
  <text class="lab" x="510" y="238" text-anchor="middle" fill="#cf222e" style="fill:#cf222e">✂ 剪枝：剩下的数不够</text>
  <text class="lab" x="510" y="254" text-anchor="middle" style="fill:#cf222e">整棵子树都不用进</text>

  <!-- 四个动作 -->
  <rect class="box" x="596" y="88" width="188" height="214" rx="10"/>
  <text x="690" y="114" font-size="14" font-weight="600" text-anchor="middle">每个节点的四个动作</text>
  <text class="mono" x="610" y="144" font-size="12.5">① 终止  收答案 / return</text>
  <text class="mono" x="610" y="172" font-size="12.5">② 做    path.append(x)</text>
  <text class="mono" x="610" y="200" font-size="12.5">③ 递归  dfs(下一层)</text>
  <text class="mono" x="610" y="228" font-size="12.5">④ 撤销  path.pop()</text>
  <text class="sub" x="610" y="258" font-size="12">②④ 成对出现：</text>
  <text class="sub" x="610" y="276" font-size="12">借了就要还，才不会</text>
  <text class="sub" x="610" y="294" font-size="12">影响兄弟分支</text>

  <text class="sub" x="596" y="338" font-size="12.5">层数 = 递归深度</text>
  <text class="sub" x="596" y="358" font-size="12.5">分支数 = 每层的候选个数</text>
  <text class="sub" x="596" y="378" font-size="12.5">叶子 / 节点数 = 答案规模</text>
  <text class="sub" x="596" y="398" font-size="12.5">→ 决定时间复杂度</text>
</svg>
