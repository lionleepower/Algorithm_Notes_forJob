<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470">
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .lv{font-size:12px;fill:#57606a}
    .edge{stroke:#8c959f;stroke-width:1.4;fill:none}
    .pool{fill:#ddf4ff;stroke:#0969da;stroke-width:1.8}
    .leaf{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.8}
    .root{fill:#fff8c5;stroke:#bf8700;stroke-width:2}
    .pt{font-size:12px;text-anchor:middle}
  </style>

  <rect width="840" height="470" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="30" y="36">排列的递归树：每下一层，候选池恰好少一个</text>
  <text class="sub" x="30" y="58">nums = [1,2,3]　每个结点标的是「<tspan class="mono">还能选谁</tspan>」，边上标的是「这一层选了谁」</text>

  <!-- 层标注 -->
  <text class="lv" x="30" y="104">i=0</text>
  <text class="lv" x="30" y="196">i=1</text>
  <text class="lv" x="30" y="288">i=2</text>
  <text class="lv" x="30" y="380">i=3</text>
  <line x1="72" y1="88" x2="72" y2="392" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- 根 -->
  <rect class="root" x="368" y="82" width="104" height="30" rx="6"/>
  <text class="mono pt" x="420" y="102">{1,2,3}</text>

  <!-- 根 -> 三个孩子 -->
  <path class="edge" d="M400 112 L200 172"/>
  <path class="edge" d="M420 112 L420 172"/>
  <path class="edge" d="M440 112 L640 172"/>
  <text class="mono" x="286" y="136" font-size="12" fill="#0969da">选 1</text>
  <text class="mono" x="428" y="146" font-size="12" fill="#0969da">选 2</text>
  <text class="mono" x="536" y="136" font-size="12" fill="#0969da">选 3</text>

  <!-- 第一层三个候选池 -->
  <rect class="pool" x="156" y="174" width="88" height="28" rx="6"/>
  <text class="mono pt" x="200" y="193">{2,3}</text>
  <rect class="pool" x="376" y="174" width="88" height="28" rx="6"/>
  <text class="mono pt" x="420" y="193">{1,3}</text>
  <rect class="pool" x="596" y="174" width="88" height="28" rx="6"/>
  <text class="mono pt" x="640" y="193">{1,2}</text>

  <!-- 第一层 -> 第二层 -->
  <path class="edge" d="M186 202 L130 264"/>
  <path class="edge" d="M214 202 L270 264"/>
  <path class="edge" d="M406 202 L350 264"/>
  <path class="edge" d="M434 202 L490 264"/>
  <path class="edge" d="M626 202 L570 264"/>
  <path class="edge" d="M654 202 L710 264"/>

  <rect class="pool" x="100" y="266" width="60" height="26" rx="6"/>
  <text class="mono pt" x="130" y="284">{3}</text>
  <rect class="pool" x="240" y="266" width="60" height="26" rx="6"/>
  <text class="mono pt" x="270" y="284">{2}</text>
  <rect class="pool" x="320" y="266" width="60" height="26" rx="6"/>
  <text class="mono pt" x="350" y="284">{3}</text>
  <rect class="pool" x="460" y="266" width="60" height="26" rx="6"/>
  <text class="mono pt" x="490" y="284">{1}</text>
  <rect class="pool" x="540" y="266" width="60" height="26" rx="6"/>
  <text class="mono pt" x="570" y="284">{2}</text>
  <rect class="pool" x="680" y="266" width="60" height="26" rx="6"/>
  <text class="mono pt" x="710" y="284">{1}</text>

  <!-- 第二层 -> 叶子 -->
  <path class="edge" d="M130 292 L130 352"/>
  <path class="edge" d="M270 292 L270 352"/>
  <path class="edge" d="M350 292 L350 352"/>
  <path class="edge" d="M490 292 L490 352"/>
  <path class="edge" d="M570 292 L570 352"/>
  <path class="edge" d="M710 292 L710 352"/>

  <rect class="leaf" x="88" y="354" width="84" height="28" rx="6"/>
  <text class="mono pt" x="130" y="373">1,2,3</text>
  <rect class="leaf" x="228" y="354" width="84" height="28" rx="6"/>
  <text class="mono pt" x="270" y="373">1,3,2</text>
  <rect class="leaf" x="308" y="354" width="84" height="28" rx="6"/>
  <text class="mono pt" x="350" y="373">2,1,3</text>
  <rect class="leaf" x="448" y="354" width="84" height="28" rx="6"/>
  <text class="mono pt" x="490" y="373">2,3,1</text>
  <rect class="leaf" x="528" y="354" width="84" height="28" rx="6"/>
  <text class="mono pt" x="570" y="373">3,1,2</text>
  <rect class="leaf" x="668" y="354" width="84" height="28" rx="6"/>
  <text class="mono pt" x="710" y="373">3,2,1</text>

  <!-- 右侧分支数标注 -->
  <text class="mono" x="768" y="102" font-size="12" fill="#bf8700">3 个分支</text>
  <text class="mono" x="768" y="194" font-size="12" fill="#0969da">2 个分支</text>
  <text class="mono" x="768" y="286" font-size="12" fill="#0969da">1 个分支</text>
  <text class="mono" x="768" y="374" font-size="12" fill="#1a7f37">3! = 6 片叶</text>

  <!-- 底部结论 -->
  <rect x="30" y="404" width="780" height="46" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="46" y="424" font-size="13">和 <tspan font-weight="600">组合</tspan> 的分水岭：组合每层只从「上一个数之后」往下选，分支单调收窄；</text>
  <text x="46" y="442" font-size="13">排列<tspan font-weight="600" fill="#cf222e">每层都要扫全部候选</tspan>——后面的数可以排在前面，所以写 <tspan class="mono">range(n)</tspan> 而不是 <tspan class="mono">range(i, n)</tspan>。</text>
</svg>
