<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2328"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .sm{font-size:12px;fill:#57606a}
    .box{fill:#ffffff;stroke:#1f2328;stroke-width:1.6}
    .blue{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
    .red{fill:#ffebe9;stroke:#cf222e;stroke-width:2}
    .yel{fill:#fff8c5;stroke:#bf8700;stroke-width:2}
    .grn{fill:#dafbe1;stroke:#1a7f37;stroke-width:2}
    .dash{fill:none;stroke:#8c959f;stroke-width:1.6;stroke-dasharray:5 3}
    .lnk{stroke:#1f2328;stroke-width:1.8;fill:none;marker-end:url(#ar)}
    .lnkb{stroke:#0969da;stroke-width:2;fill:none;marker-end:url(#arb)}
    .lnkr{stroke:#cf222e;stroke-width:2;fill:none;marker-end:url(#arr)}
    .thin{stroke:#8c959f;stroke-width:1.4;fill:none}
  </style>
  <rect width="800" height="400" fill="#fbfbfd" rx="10"/>
  <text class="ttl" x="32" y="36">一维背包的遍历方向：倒序 = 每件只用一次，正序 = 可以重复用</text>
  <text class="sub" x="32" y="58">物品重量 w = 2；f[j] 依赖 f[j−2]。箭头从被依赖的格子指向要更新的格子</text>
  <text class="sub" x="32" y="78" style="font-weight:600;">0-1 背包：j 从大到小（倒序）</text>
  <rect class="box" x="120" y="100" width="58" height="38" rx="6"/>
  <text class="mono" x="149.0" y="124.0" text-anchor="middle" style="font-size:13px;">f[0]</text>
  <rect class="box" x="186" y="100" width="58" height="38" rx="6"/>
  <text class="mono" x="215.0" y="124.0" text-anchor="middle" style="font-size:13px;">f[1]</text>
  <rect class="box" x="252" y="100" width="58" height="38" rx="6"/>
  <text class="mono" x="281.0" y="124.0" text-anchor="middle" style="font-size:13px;">f[2]</text>
  <rect class="box" x="318" y="100" width="58" height="38" rx="6"/>
  <text class="mono" x="347.0" y="124.0" text-anchor="middle" style="font-size:13px;">f[3]</text>
  <rect class="box" x="384" y="100" width="58" height="38" rx="6"/>
  <text class="mono" x="413.0" y="124.0" text-anchor="middle" style="font-size:13px;">f[4]</text>
  <rect class="box" x="450" y="100" width="58" height="38" rx="6"/>
  <text class="mono" x="479.0" y="124.0" text-anchor="middle" style="font-size:13px;">f[5]</text>
  <rect class="box" x="516" y="100" width="58" height="38" rx="6"/>
  <text class="mono" x="545.0" y="124.0" text-anchor="middle" style="font-size:13px;">f[6]</text>
  <text class="sm" x="545.0" y="92" text-anchor="middle" style="fill:#0969da;font-weight:600;">第1个</text>
  <path class="lnkb" d="M 413.0 140 Q 479.0 178 541.0 142"/>
  <text class="sm" x="479.0" y="92" text-anchor="middle" style="fill:#0969da;font-weight:600;">第2个</text>
  <path class="lnkb" d="M 347.0 140 Q 413.0 178 475.0 142"/>
  <text class="sm" x="413.0" y="92" text-anchor="middle" style="fill:#0969da;font-weight:600;">第3个</text>
  <path class="lnkb" d="M 281.0 140 Q 347.0 178 409.0 142"/>
  <text class="sm" x="347.0" y="92" text-anchor="middle" style="fill:#0969da;font-weight:600;">第4个</text>
  <path class="lnkb" d="M 215.0 140 Q 281.0 178 343.0 142"/>
  <text class="sm" x="281.0" y="92" text-anchor="middle" style="fill:#0969da;font-weight:600;">第5个</text>
  <path class="lnkb" d="M 149.0 140 Q 215.0 178 277.0 142"/>
  <text class="sm" x="347.0" y="204" text-anchor="middle">先更新大的 j：读到的 f[j−2] 还是「没放过这件」的旧值 → 每件最多放一次</text>
  <text class="sub" x="32" y="238" style="font-weight:600;">完全背包：j 从小到大（正序）</text>
  <rect class="box" x="120" y="260" width="58" height="38" rx="6"/>
  <text class="mono" x="149.0" y="284.0" text-anchor="middle" style="font-size:13px;">f[0]</text>
  <rect class="box" x="186" y="260" width="58" height="38" rx="6"/>
  <text class="mono" x="215.0" y="284.0" text-anchor="middle" style="font-size:13px;">f[1]</text>
  <rect class="box" x="252" y="260" width="58" height="38" rx="6"/>
  <text class="mono" x="281.0" y="284.0" text-anchor="middle" style="font-size:13px;">f[2]</text>
  <rect class="box" x="318" y="260" width="58" height="38" rx="6"/>
  <text class="mono" x="347.0" y="284.0" text-anchor="middle" style="font-size:13px;">f[3]</text>
  <rect class="box" x="384" y="260" width="58" height="38" rx="6"/>
  <text class="mono" x="413.0" y="284.0" text-anchor="middle" style="font-size:13px;">f[4]</text>
  <rect class="box" x="450" y="260" width="58" height="38" rx="6"/>
  <text class="mono" x="479.0" y="284.0" text-anchor="middle" style="font-size:13px;">f[5]</text>
  <rect class="box" x="516" y="260" width="58" height="38" rx="6"/>
  <text class="mono" x="545.0" y="284.0" text-anchor="middle" style="font-size:13px;">f[6]</text>
  <text class="sm" x="281.0" y="252" text-anchor="middle" style="fill:#cf222e;font-weight:600;">第1个</text>
  <path class="lnkr" d="M 149.0 300 Q 215.0 338 277.0 302"/>
  <text class="sm" x="347.0" y="252" text-anchor="middle" style="fill:#cf222e;font-weight:600;">第2个</text>
  <path class="lnkr" d="M 215.0 300 Q 281.0 338 343.0 302"/>
  <text class="sm" x="413.0" y="252" text-anchor="middle" style="fill:#cf222e;font-weight:600;">第3个</text>
  <path class="lnkr" d="M 281.0 300 Q 347.0 338 409.0 302"/>
  <text class="sm" x="479.0" y="252" text-anchor="middle" style="fill:#cf222e;font-weight:600;">第4个</text>
  <path class="lnkr" d="M 347.0 300 Q 413.0 338 475.0 302"/>
  <text class="sm" x="545.0" y="252" text-anchor="middle" style="fill:#cf222e;font-weight:600;">第5个</text>
  <path class="lnkr" d="M 413.0 300 Q 479.0 338 541.0 302"/>
  <text class="sm" x="347.0" y="364" text-anchor="middle">先更新小的 j：读到的 f[j−2] 已经是「放过这件」的新值 → 可以重复放</text>
  <text class="sub" x="32" y="392">口诀：只能用一次 → 倒序；能用无限次 → 正序。</text>
</svg>
