<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430">
  <defs>
    <marker id="ar5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .cell{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5;rx:6}
    .bad{fill:#ffebe9;stroke:#cf222e;stroke-width:2;rx:6}
    .blocked{stroke:#cf222e;stroke-width:2.2;fill:none;stroke-dasharray:5 4;marker-end:url(#ar5)}
  </style>

  <rect width="800" height="430" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="38">递推为什么开 k+2 列：多出来的那一列是「非法状态」哨兵</text>
  <text class="sub" x="32" y="60">递归里 j 能取到 -1，Python 下标不能为负 ⇒ j 维整体 +1 偏移，f[·][j+1] 对应 dfs(·, j)</text>

  <!-- 列头 -->
  <text class="mono sub" x="112" y="106" font-size="12" text-anchor="end">数组下标 j+1</text>
  <text class="mono sub" x="112" y="130" font-size="12" text-anchor="end">真实预算 j</text>
  <text class="mono" x="170" y="106" font-size="13" text-anchor="middle" fill="#cf222e" font-weight="600">0</text>
  <text class="mono" x="170" y="130" font-size="13" text-anchor="middle" fill="#cf222e" font-weight="600">-1</text>
  <text class="mono" x="280" y="106" font-size="13" text-anchor="middle">1</text>
  <text class="mono" x="280" y="130" font-size="13" text-anchor="middle">0</text>
  <text class="mono" x="390" y="106" font-size="13" text-anchor="middle">2</text>
  <text class="mono" x="390" y="130" font-size="13" text-anchor="middle">1</text>
  <text class="mono" x="500" y="106" font-size="13" text-anchor="middle">3</text>
  <text class="mono" x="500" y="130" font-size="13" text-anchor="middle">2</text>
  <text class="mono sub" x="610" y="118" font-size="15" text-anchor="middle">…</text>
  <text class="mono" x="720" y="106" font-size="13" text-anchor="middle">k+1</text>
  <text class="mono" x="720" y="130" font-size="13" text-anchor="middle">k</text>

  <!-- 行：未持有 -->
  <text class="sub" x="112" y="176" font-size="13" text-anchor="end">f[0][·][0]</text>
  <rect class="bad"  x="120" y="150" width="100" height="42"/>
  <text class="mono" x="170" y="177" font-size="14" text-anchor="middle" fill="#cf222e" font-weight="600">-inf</text>
  <rect class="cell" x="230" y="150" width="100" height="42"/>
  <text class="mono" x="280" y="177" font-size="14" text-anchor="middle">0</text>
  <rect class="cell" x="340" y="150" width="100" height="42"/>
  <text class="mono" x="390" y="177" font-size="14" text-anchor="middle">0</text>
  <rect class="cell" x="450" y="150" width="100" height="42"/>
  <text class="mono" x="500" y="177" font-size="14" text-anchor="middle">0</text>
  <rect class="cell" x="670" y="150" width="100" height="42"/>
  <text class="mono" x="720" y="177" font-size="14" text-anchor="middle">0</text>

  <!-- 行：持有 -->
  <text class="sub" x="112" y="228" font-size="13" text-anchor="end">f[0][·][1]</text>
  <rect class="bad"  x="120" y="202" width="100" height="42"/>
  <text class="mono" x="170" y="229" font-size="14" text-anchor="middle" fill="#cf222e" font-weight="600">-inf</text>
  <rect class="cell" x="230" y="202" width="100" height="42"/>
  <text class="mono sub" x="280" y="229" font-size="14" text-anchor="middle">-inf</text>
  <rect class="cell" x="340" y="202" width="100" height="42"/>
  <text class="mono sub" x="390" y="229" font-size="14" text-anchor="middle">-inf</text>
  <rect class="cell" x="450" y="202" width="100" height="42"/>
  <text class="mono sub" x="500" y="229" font-size="14" text-anchor="middle">-inf</text>
  <rect class="cell" x="670" y="202" width="100" height="42"/>
  <text class="mono sub" x="720" y="229" font-size="14" text-anchor="middle">-inf</text>

  <!-- 被堵死的卖出边 -->
  <path class="blocked" d="M 200 200 Q 240 208 264 196"/>
  <text class="mono" x="196" y="272" font-size="12.5" fill="#cf222e">f[i][0][1] 恒为 -inf ⇒ j+1=1（真实预算 0）时卖出边被堵死，不需要任何 if</text>

  <text class="mono sub" x="120" y="298" font-size="12.5">初始化 for j in range(1, k+2): f[0][j][0] = 0　——　故意从 1 开始，第 0 列保持 -inf</text>

  <!-- 底部 -->
  <line x1="32" y1="326" x2="768" y2="326" stroke="#d0d7de" stroke-width="1"/>
  <text x="32" y="350" font-size="14" font-weight="600" fill="#cf222e">为什么不能只开 k+1 列？</text>
  <text class="sub" x="32" y="374" font-size="13">循环从 j = 0 开始时，f[i][j-1][1] 变成 f[i][-1][1] —— Python 负下标不报错，会静默取到最后一列，答案错得毫无征兆。</text>
  <text class="sub" x="32" y="400" font-size="13">多开一格 + 循环从 1 开始，是为了让越界访问变成受控的 -inf，而不是变成 wraparound。</text>
  <text class="mono" x="32" y="422" font-size="12.5" fill="#0969da">k+2 = (k+1 个合法预算值 0..k) + (1 列 -inf 哨兵)，等价于递归里 if j &lt; 0: return -inf</text>
</svg>
