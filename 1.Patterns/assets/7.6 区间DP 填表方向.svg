<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <marker id="p6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .cell{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5;rx:5}
    .dead{fill:#f0f1f3;stroke:#e1e4e8;stroke-width:1;rx:5}
    .base{fill:#dafbe1;stroke:#1a7f37;stroke-width:2;rx:5}
    .src{fill:#fff8c5;stroke:#bf8700;stroke-width:2;rx:5}
    .tgt{fill:#ddf4ff;stroke:#0969da;stroke-width:2.5;rx:5}
    .ans{fill:#fbefff;stroke:#8250df;stroke-width:2.5;rx:5}
    .dep{stroke:#8250df;stroke-width:2.5;fill:none;marker-end:url(#p6b)}
  </style>

  <rect width="800" height="460" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="38">递推的循环顺序不是背下来的，是从依赖方向读出来的</text>
  <text class="sub" x="32" y="60">f[i][j] 依赖 f[i+1][j-1]（左下）、f[i+1][j]（下方）、f[i][j-1]（左方）　·　n = 5</text>

  <!-- 列头 -->
  <text class="mono" x="116" y="100" font-size="13" text-anchor="middle" fill="#57606a">j=0</text>
  <text class="mono" x="172" y="100" font-size="13" text-anchor="middle" fill="#57606a">j=1</text>
  <text class="mono" x="228" y="100" font-size="13" text-anchor="middle" fill="#57606a">j=2</text>
  <text class="mono" x="284" y="100" font-size="13" text-anchor="middle" fill="#57606a">j=3</text>
  <text class="mono" x="340" y="100" font-size="13" text-anchor="middle" fill="#57606a">j=4</text>

  <!-- 行头 -->
  <text class="mono" x="78" y="146" font-size="13" text-anchor="end" fill="#57606a">i=0</text>
  <text class="mono" x="78" y="202" font-size="13" text-anchor="end" fill="#57606a">i=1</text>
  <text class="mono" x="78" y="258" font-size="13" text-anchor="end" fill="#57606a">i=2</text>
  <text class="mono" x="78" y="314" font-size="13" text-anchor="end" fill="#57606a">i=3</text>
  <text class="mono" x="78" y="370" font-size="13" text-anchor="end" fill="#57606a">i=4</text>

  <!-- i=0 -->
  <rect class="base" x="90" y="120" width="52" height="48"/>
  <rect class="cell" x="146" y="120" width="52" height="48"/>
  <rect class="cell" x="202" y="120" width="52" height="48"/>
  <rect class="cell" x="258" y="120" width="52" height="48"/>
  <rect class="ans"  x="314" y="120" width="52" height="48"/>
  <text class="mono" x="340" y="150" font-size="13" text-anchor="middle" font-weight="600" fill="#8250df">答案</text>
  <!-- i=1 -->
  <rect class="dead" x="90"  y="176" width="52" height="48"/>
  <rect class="base" x="146" y="176" width="52" height="48"/>
  <rect class="src"  x="202" y="176" width="52" height="48"/>
  <text class="mono" x="228" y="206" font-size="12" text-anchor="middle">左方</text>
  <rect class="tgt"  x="258" y="176" width="52" height="48"/>
  <text class="mono" x="284" y="200" font-size="12" text-anchor="middle" font-weight="600">f[1][3]</text>
  <text class="mono" x="284" y="216" font-size="11" text-anchor="middle" fill="#0969da">目标</text>
  <rect class="cell" x="314" y="176" width="52" height="48"/>
  <!-- i=2 -->
  <rect class="dead" x="90"  y="232" width="52" height="48"/>
  <rect class="dead" x="146" y="232" width="52" height="48"/>
  <rect class="src"  x="202" y="232" width="52" height="48"/>
  <text class="mono" x="228" y="262" font-size="12" text-anchor="middle">左下</text>
  <rect class="src"  x="258" y="232" width="52" height="48"/>
  <text class="mono" x="284" y="262" font-size="12" text-anchor="middle">下方</text>
  <rect class="cell" x="314" y="232" width="52" height="48"/>
  <!-- i=3 -->
  <rect class="dead" x="90"  y="288" width="52" height="48"/>
  <rect class="dead" x="146" y="288" width="52" height="48"/>
  <rect class="dead" x="202" y="288" width="52" height="48"/>
  <rect class="base" x="258" y="288" width="52" height="48"/>
  <rect class="cell" x="314" y="288" width="52" height="48"/>
  <!-- i=4 -->
  <rect class="dead" x="90"  y="344" width="52" height="48"/>
  <rect class="dead" x="146" y="344" width="52" height="48"/>
  <rect class="dead" x="202" y="344" width="52" height="48"/>
  <rect class="dead" x="258" y="344" width="52" height="48"/>
  <rect class="base" x="314" y="344" width="52" height="48"/>

  <!-- 对角线 base 标注 -->
  <text class="mono" x="116" y="150" font-size="13" text-anchor="middle" fill="#1a7f37">1</text>
  <text class="mono" x="172" y="206" font-size="13" text-anchor="middle" fill="#1a7f37">1</text>
  <text class="mono" x="228" y="318" font-size="13" text-anchor="middle" fill="#1a7f37"> </text>
  <text class="mono" x="284" y="318" font-size="13" text-anchor="middle" fill="#1a7f37">1</text>
  <text class="mono" x="340" y="374" font-size="13" text-anchor="middle" fill="#1a7f37">1</text>

  <!-- 依赖箭头 -->
  <line class="dep" x1="228" y1="228" x2="272" y2="184"/>
  <line class="dep" x1="284" y1="228" x2="284" y2="184"/>
  <line class="dep" x1="258" y1="200" x2="252" y2="200"/>

  <!-- 图例 -->
  <rect class="base" x="90" y="410" width="20" height="18"/>
  <text class="sub" x="118" y="424" font-size="12">对角线 = base（单字符为 1）</text>
  <rect class="dead" x="270" y="410" width="20" height="18"/>
  <text class="sub" x="298" y="424" font-size="12">下三角 j &lt; i = 空区间，恒 0，不用填</text>

  <!-- ===== 右侧 ===== -->
  <rect x="410" y="86" width="358" height="150" fill="#ffffff" stroke="#8250df" stroke-width="1.5" rx="8"/>
  <text x="428" y="112" font-size="14" font-weight="600" fill="#8250df">从依赖方向推出循环方向</text>
  <text class="sub" x="428" y="136" font-size="13">需要 i+1（更大的 i）先算好　⇒　<tspan class="mono" font-weight="600" fill="#1f2328">i 倒序</tspan></text>
  <text class="sub" x="428" y="158" font-size="13">需要 j-1（更小的 j）先算好　⇒　<tspan class="mono" font-weight="600" fill="#1f2328">j 正序</tspan></text>
  <text class="sub" x="428" y="182" font-size="13">j 从 i+1 起步：j &lt; i 的格子是空区间，恒为 0，</text>
  <text class="sub" x="428" y="200" font-size="13">压根不需要填。</text>
  <text class="sub" x="428" y="222" font-size="13">入口在<tspan fill="#8250df" font-weight="600">右上角 f[0][n-1]</tspan>——整个串这个区间。</text>

  <rect x="410" y="252" width="358" height="176" fill="#ffffff" stroke="#0969da" stroke-width="1.5" rx="8"/>
  <text x="428" y="278" font-size="14" font-weight="600" fill="#0969da">两种等价的遍历外壳</text>
  <text class="mono" x="428" y="304" font-size="12.5">for i in range(n-1, -1, -1):    # 倒序</text>
  <text class="mono" x="428" y="322" font-size="12.5">    f[i][i] = 1</text>
  <text class="mono" x="428" y="340" font-size="12.5">    for j in range(i+1, n):     # 正序</text>
  <line x1="428" y1="356" x2="750" y2="356" stroke="#d0d7de" stroke-width="1"/>
  <text class="mono" x="428" y="378" font-size="12.5">for L in range(1, n):           # 按区间长度</text>
  <text class="mono" x="428" y="396" font-size="12.5">    for i in range(n-L): j = i+L</text>
  <text class="sub"  x="428" y="418" font-size="12">「短区间先算」更通用，枚举分割点型建议默认用它</text>
</svg>
