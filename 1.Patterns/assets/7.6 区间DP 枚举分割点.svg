<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470">
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .poly{stroke:#8c959f;stroke-width:1.5;fill:none}
    .vtx{fill:#ffffff;stroke:#1f2328;stroke-width:2}
  </style>

  <rect width="800" height="470" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="38">枚举分割点型区间 DP：切下一块，剩下两块各自最优</text>
  <text class="sub" x="32" y="60">dfs(i, j) = 顶点 i…j 依次相连、再用弦 (i, j) 封口的子多边形，其三角剖分最低得分</text>

  <!-- ==== 多边形 ==== -->
  <!-- 右块（四边形 2-3-4-5） -->
  <polygon points="295,295 200,350 105,295 105,185" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <!-- 左块（三角形 0-1-2） -->
  <polygon points="200,130 295,185 295,295" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <!-- 中间三角形 (i, k, j) -->
  <polygon points="200,130 295,295 105,185" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>

  <!-- 封口边 (i, j) = 边 0-5，加粗 -->
  <line x1="200" y1="130" x2="105" y2="185" stroke="#cf222e" stroke-width="5" stroke-linecap="round"/>

  <!-- 顶点 -->
  <circle class="vtx" cx="200" cy="130" r="6"/>
  <circle class="vtx" cx="295" cy="185" r="6"/>
  <circle class="vtx" cx="295" cy="295" r="6"/>
  <circle class="vtx" cx="200" cy="350" r="6"/>
  <circle class="vtx" cx="105" cy="295" r="6"/>
  <circle class="vtx" cx="105" cy="185" r="6"/>

  <text class="mono" x="200" y="116" font-size="14" text-anchor="middle" font-weight="600" fill="#cf222e">i = 0</text>
  <text class="mono" x="312" y="182" font-size="14">1</text>
  <text class="mono" x="312" y="302" font-size="14" font-weight="600" fill="#bf8700">k = 2</text>
  <text class="mono" x="200" y="374" font-size="14" text-anchor="middle">3</text>
  <text class="mono" x="90"  y="302" font-size="14" text-anchor="end">4</text>
  <text class="mono" x="90"  y="190" font-size="14" text-anchor="end" font-weight="600" fill="#cf222e">j = 5</text>

  <!-- 区域标注 -->
  <text class="sub" x="262" y="208" font-size="12" text-anchor="middle" fill="#0969da">左块</text>
  <text class="sub" x="262" y="222" font-size="11" text-anchor="middle" fill="#0969da">dfs(i,k)</text>
  <text class="sub" x="196" y="216" font-size="12" text-anchor="middle" fill="#bf8700">三角形</text>
  <text class="sub" x="196" y="230" font-size="11" text-anchor="middle" fill="#bf8700">(i,k,j)</text>
  <text class="sub" x="176" y="286" font-size="12" text-anchor="middle" fill="#1a7f37">右块</text>
  <text class="sub" x="176" y="300" font-size="11" text-anchor="middle" fill="#1a7f37">dfs(k,j)</text>

  <text class="sub" x="32" y="404" font-size="12" fill="#cf222e">粗红线 = 封口边 (i, j)</text>
  <text class="mono" x="32" y="432" font-size="13">dfs(i,j) = min over k of</text>
  <text class="mono" x="32" y="452" font-size="13">  dfs(i,k) + dfs(k,j) + v[i]*v[k]*v[j]</text>

  <!-- ==== 右侧说明 ==== -->
  <rect x="410" y="86" width="358" height="176" fill="#ffffff" stroke="#bf8700" stroke-width="1.5" rx="8"/>
  <text x="428" y="112" font-size="14" font-weight="600" fill="#bf8700">for k 不是盲目穷举，背后有一条性质</text>
  <text class="sub" x="428" y="136" font-size="13">封口边 (i, j) 只有一侧有图形，所以贴着它的</text>
  <text class="sub" x="428" y="154" font-size="13">三角形<tspan font-weight="600" fill="#1f2328">有且仅有一个</tspan>，第三个顶点 k 满足 i &lt; k &lt; j。</text>
  <text class="sub" x="428" y="182" font-size="13"><tspan font-weight="600" fill="#1a7f37">不漏</tspan>：k 取遍 (i, j) 之间所有顶点。</text>
  <text class="sub" x="428" y="204" font-size="13"><tspan font-weight="600" fill="#1a7f37">不重</tspan>：k 不同 ⇒ 三角形不同 ⇒ 方案互斥。</text>
  <text class="sub" x="428" y="232" font-size="13">两块只在顶点处接触，内部无公共区域、也不能跨块</text>
  <text class="sub" x="428" y="250" font-size="13">连对角线 ⇒ 各自最优即整体最优（无后效性）。</text>

  <rect x="410" y="278" width="358" height="164" fill="#ffffff" stroke="#0969da" stroke-width="1.5" rx="8"/>
  <text x="428" y="304" font-size="14" font-weight="600" fill="#0969da">区间 DP 的两大子类（最该记住的一点）</text>

  <line x1="428" y1="318" x2="750" y2="318" stroke="#d0d7de" stroke-width="1"/>
  <text class="sub" x="428" y="338" font-size="12" font-weight="600">题型</text>
  <text class="sub" x="530" y="338" font-size="12" font-weight="600">决策问什么</text>
  <text class="sub" x="662" y="338" font-size="12" font-weight="600">分支数</text>
  <line x1="428" y1="348" x2="750" y2="348" stroke="#d0d7de" stroke-width="1"/>

  <text class="sub" x="428" y="372" font-size="12">516 缩边界</text>
  <text class="sub" x="530" y="372" font-size="12">两个端点怎么处理</text>
  <text class="mono" x="662" y="372" font-size="12">O(1) 支</text>

  <text class="sub" x="428" y="398" font-size="12" font-weight="600">1039 选分割点</text>
  <text class="sub" x="530" y="398" font-size="12">在哪里切开</text>
  <text class="mono" x="662" y="398" font-size="12" font-weight="600">O(n) 支</text>
  <line x1="428" y1="410" x2="750" y2="410" stroke="#d0d7de" stroke-width="1"/>

  <text class="sub" x="428" y="432" font-size="12">看到 for k 套 dfs(i,k) + dfs(k,j) 就该反应：时间多一个 O(n)</text>
</svg>
