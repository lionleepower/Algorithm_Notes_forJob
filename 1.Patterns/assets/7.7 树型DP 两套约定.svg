<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .edge{stroke:#8c959f;stroke-width:1.5}
    .vedge{stroke:#cf222e;stroke-width:2;stroke-dasharray:5 4}
    .nd{fill:#ffffff;stroke:#1f2328;stroke-width:2}
    .nul{fill:#ffebe9;stroke:#cf222e;stroke-width:1.5;stroke-dasharray:4 3}
  </style>

  <rect width="800" height="440" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="38">-1 这个哨兵不是拍脑袋定的，是被「叶子必须返回 0」反推出来的</text>
  <text class="sub" x="32" y="60">合同：dfs(node) = 以 node 为起点向下走到叶子，最长那条链的<tspan font-weight="600" fill="#1f2328">边数</tspan>（不是节点数）</text>

  <!-- ===== 左：叶子推演 ===== -->
  <rect x="32" y="82" width="330" height="200" fill="#ffffff" stroke="#cf222e" stroke-width="1.5" rx="8"/>
  <text x="50" y="108" font-size="14" font-weight="600" fill="#cf222e">叶子节点：两条「本不存在的边」被抵消掉</text>

  <line class="vedge" x1="197" y1="160" x2="152" y2="205"/>
  <line class="vedge" x1="197" y1="160" x2="242" y2="205"/>
  <circle class="nd" cx="197" cy="148" r="16"/>
  <text class="mono" x="197" y="153" font-size="13" text-anchor="middle" font-weight="600">叶</text>
  <circle class="nul" cx="145" cy="212" r="14"/>
  <text class="mono" x="145" y="217" font-size="12" text-anchor="middle" fill="#cf222e">-1</text>
  <circle class="nul" cx="249" cy="212" r="14"/>
  <text class="mono" x="249" y="217" font-size="12" text-anchor="middle" fill="#cf222e">-1</text>

  <text class="mono" x="118" y="188" font-size="11" fill="#cf222e">虚边 +1</text>
  <text class="mono" x="256" y="188" font-size="11" fill="#cf222e">虚边 +1</text>

  <text class="mono" x="50" y="252" font-size="13">return max(-1, -1) + 1 = 0</text>
  <text class="sub"  x="50" y="272" font-size="12">叶子到它自己，0 条边 ✓　空儿子的 -1 与虚边的 +1 恰好抵消</text>

  <!-- ===== 右：两套约定对照 ===== -->
  <rect x="386" y="82" width="382" height="200" fill="#ffffff" stroke="#0969da" stroke-width="1.5" rx="8"/>
  <text x="404" y="108" font-size="14" font-weight="600" fill="#0969da">两套等价约定，答案相同，但绝不能混用</text>

  <line x1="404" y1="120" x2="750" y2="120" stroke="#d0d7de" stroke-width="1"/>
  <text class="sub" x="404" y="140" font-size="12" font-weight="600">返回值语义</text>
  <text class="sub" x="566" y="140" font-size="12" font-weight="600">边数版</text>
  <text class="sub" x="672" y="140" font-size="12" font-weight="600">节点数版</text>
  <line x1="404" y1="150" x2="750" y2="150" stroke="#d0d7de" stroke-width="1"/>

  <text class="sub"  x="404" y="174" font-size="12">空节点返回</text>
  <text class="mono" x="566" y="174" font-size="12" fill="#cf222e" font-weight="600">-1</text>
  <text class="mono" x="672" y="174" font-size="12" fill="#1a7f37" font-weight="600">0</text>

  <text class="sub"  x="404" y="200" font-size="12">叶子返回</text>
  <text class="mono" x="566" y="200" font-size="12">0</text>
  <text class="mono" x="672" y="200" font-size="12">1</text>

  <text class="sub"  x="404" y="226" font-size="12">拐点路径</text>
  <text class="mono" x="566" y="226" font-size="12" fill="#cf222e" font-weight="600">l + r + 2</text>
  <text class="mono" x="672" y="226" font-size="12" fill="#1a7f37" font-weight="600">l + r</text>

  <text class="sub"  x="404" y="252" font-size="12">向上传</text>
  <text class="mono" x="566" y="252" font-size="12">max(l,r) + 1</text>
  <text class="mono" x="672" y="252" font-size="12">max(l,r) + 1</text>
  <line x1="404" y1="264" x2="750" y2="264" stroke="#d0d7de" stroke-width="1"/>

  <!-- ===== 中部：+1 / +2 是同一个东西 ===== -->
  <text x="32" y="316" font-size="14" font-weight="600">所有的 +1 都在数同一样东西：node 连到儿子的那条<tspan fill="#0969da">连接边</tspan></text>
  <text class="mono" x="32" y="342" font-size="13">    左链最深处 ←…← 左儿子 ← node → 右儿子 →…→ 右链最深处</text>
  <text class="mono" x="196" y="360" font-size="12" fill="#0969da">↑ 边 1</text>
  <text class="mono" x="330" y="360" font-size="12" fill="#0969da">↑ 边 2</text>
  <text class="sub" x="470" y="342" font-size="13">return 只接<tspan font-weight="600" fill="#1f2328">一个</tspan>方向 ⇒ +1</text>
  <text class="sub" x="470" y="362" font-size="13">拐点<tspan font-weight="600" fill="#1f2328">左右都要</tspan>接上 ⇒ +2</text>

  <!-- ===== 底部：混用后果 ===== -->
  <line x1="32" y1="380" x2="768" y2="380" stroke="#d0d7de" stroke-width="1"/>
  <text x="32" y="404" font-size="13" font-weight="600" fill="#cf222e">最经典的 bug：写了 return -1（边数版）却配 ans = max(ans, l + r)（节点数版公式）⇒ 答案恒偏小 2</text>
  <text class="sub" x="32" y="426" font-size="13">记法：<tspan class="mono" font-weight="600" fill="#1f2328">空节点 -1 ⇔ 拐点 +2</tspan>　·　<tspan class="mono" font-weight="600" fill="#1f2328">空节点 0 ⇔ 拐点不加</tspan>　——　一改就得两处一起改。</text>
</svg>
