<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .edge{stroke:#8c959f;stroke-width:1.5}
    .nd{fill:#ffffff;stroke:#1f2328;stroke-width:2}
    .sel{fill:#ffd8a8;stroke:#bf8700;stroke-width:3}
  </style>

  <rect width="800" height="440" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="38">自底向上推演：root = [3,2,3,null,3,null,1]</text>
  <text class="sub" x="32" y="60">每个节点标注 <tspan class="mono" font-weight="600" fill="#1f2328">(rob, notRob)</tspan> —— 依赖方向是「父依赖子」，所以必须先算完两个儿子再算自己（后序）</text>

  <!-- ===== 树 ===== -->
  <line class="edge" x1="200" y1="112" x2="140" y2="168"/>
  <line class="edge" x1="200" y1="112" x2="266" y2="168"/>
  <line class="edge" x1="140" y1="192" x2="182" y2="248"/>
  <line class="edge" x1="266" y1="192" x2="308" y2="248"/>

  <circle class="sel" cx="200" cy="100" r="20"/>
  <text class="mono" x="200" y="106" font-size="15" text-anchor="middle" font-weight="600">3</text>
  <circle class="nd"  cx="132" cy="180" r="18"/>
  <text class="mono" x="132" y="186" font-size="14" text-anchor="middle">2</text>
  <circle class="nd"  cx="272" cy="180" r="18"/>
  <text class="mono" x="272" y="186" font-size="14" text-anchor="middle">3</text>
  <circle class="sel" cx="190" cy="260" r="18"/>
  <text class="mono" x="190" y="266" font-size="14" text-anchor="middle" font-weight="600">3</text>
  <circle class="sel" cx="316" cy="260" r="18"/>
  <text class="mono" x="316" y="266" font-size="14" text-anchor="middle" font-weight="600">1</text>

  <text class="mono" x="234" y="94"  font-size="13" fill="#8250df" font-weight="600">(7, 6)</text>
  <text class="mono" x="62"  y="186" font-size="13" fill="#57606a">(2, 3)</text>
  <text class="mono" x="300" y="176" font-size="13" fill="#57606a">(3, 1)</text>
  <text class="mono" x="126" y="266" font-size="13" fill="#57606a">(3, 0)</text>
  <text class="mono" x="344" y="266" font-size="13" fill="#57606a">(1, 0)</text>

  <text class="sub" x="200" y="308" font-size="12.5" text-anchor="middle">橙色 = 最优方案实际选中的点（根 + 两个孙子）</text>

  <!-- ===== 右侧计算表 ===== -->
  <rect x="400" y="84" width="368" height="238" fill="#ffffff" stroke="#8250df" stroke-width="1.5" rx="8"/>
  <text x="418" y="108" font-size="14" font-weight="600" fill="#8250df">逐层计算</text>

  <line x1="418" y1="120" x2="750" y2="120" stroke="#d0d7de" stroke-width="1"/>
  <text class="sub" x="418" y="142" font-size="12" font-weight="600">两个叶子</text>
  <text class="mono" x="418" y="164" font-size="12">rob = 值本身，notRob = 0　→　(3,0)　(1,0)</text>

  <line x1="418" y1="176" x2="750" y2="176" stroke="#d0d7de" stroke-width="1"/>
  <text class="sub" x="418" y="198" font-size="12" font-weight="600">节点 2（右儿子是叶子 3）</text>
  <text class="mono" x="418" y="220" font-size="12">rob    = 2 + 0 + 0 = 2</text>
  <text class="mono" x="418" y="238" font-size="12">notRob = 0 + max(3, 0) = 3　← 不选 2 反而更好</text>

  <line x1="418" y1="250" x2="750" y2="250" stroke="#d0d7de" stroke-width="1"/>
  <text class="sub" x="418" y="272" font-size="12" font-weight="600">根 3</text>
  <text class="mono" x="418" y="294" font-size="12">rob    = 3 + 3 + 1 = 7　　← 用的是儿子的 notRob</text>
  <text class="mono" x="418" y="312" font-size="12">notRob = max(2,3) + max(3,1) = 6</text>

  <!-- ===== 底部 ===== -->
  <line x1="32" y1="346" x2="768" y2="346" stroke="#d0d7de" stroke-width="1"/>
  <text class="mono" x="32" y="376" font-size="15" font-weight="600" fill="#8250df">答案 = max(dfs(root)) = max(7, 6) = 7</text>
  <text class="sub" x="32" y="400" font-size="13">根<tspan font-weight="600" fill="#1f2328">没有父亲</tspan>，两种前提都合法，所以取 max —— 写成 dfs(root)[0] 或 [1] 都是错的。</text>
  <text class="sub" x="32" y="422" font-size="13">注意节点 2 那一层：<tspan font-weight="600" fill="#1f2328">notRob 比 rob 大</tspan>，正说明「不选 node ≠ 必须选儿子」这类信息不能被一个 max 抹掉。</text>
</svg>
