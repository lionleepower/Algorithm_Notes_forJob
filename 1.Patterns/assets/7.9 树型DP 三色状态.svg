<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .edge{stroke:#8c959f;stroke-width:1.5}
    .blue{fill:#b6d7f5;stroke:#0969da;stroke-width:2.5}
    .yellow{fill:#f7e3a1;stroke:#bf8700;stroke-width:2.5}
    .red{fill:#f5b7b1;stroke:#cf222e;stroke-width:2.5}
    .nd{fill:#ffffff;stroke:#8c959f;stroke-width:1.8}
  </style>

  <rect width="800" height="440" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="38">状态个数 = 父亲做决策时，必须从孩子那里拿到的信息量</text>
  <text class="sub" x="32" y="60">「被覆盖」的来源恰好有三个方向：<tspan font-weight="600" fill="#1f2328">自己装 · 父亲装 · 儿子装</tspan>　⇒　状态维度就是 3</text>

  <!-- ===== 蓝 ===== -->
  <rect x="32" y="80" width="238" height="196" fill="#ffffff" stroke="#0969da" stroke-width="1.5" rx="8"/>
  <circle class="blue" cx="151" cy="126" r="22"/>
  <text class="mono" x="151" y="132" font-size="15" text-anchor="middle" font-weight="600">装</text>
  <text x="151" y="172" font-size="14" text-anchor="middle" font-weight="600" fill="#0969da">蓝：choose</text>
  <text class="sub" x="151" y="196" font-size="12.5" text-anchor="middle">node 自己装摄像头</text>
  <text class="sub" x="151" y="220" font-size="12" text-anchor="middle">它同时覆盖了自己、</text>
  <text class="sub" x="151" y="238" font-size="12" text-anchor="middle">父亲和所有儿子</text>
  <text class="mono" x="151" y="262" font-size="12" text-anchor="middle" fill="#0969da">成本含 +1（或 cost[x]）</text>

  <!-- ===== 黄 ===== -->
  <rect x="282" y="80" width="238" height="196" fill="#ffffff" stroke="#bf8700" stroke-width="1.5" rx="8"/>
  <circle class="nd" cx="401" cy="106" r="14"/>
  <text class="sub" x="424" y="111" font-size="11" fill="#bf8700">父亲装</text>
  <line class="edge" x1="401" y1="120" x2="401" y2="140"/>
  <circle class="yellow" cx="401" cy="154" r="22"/>
  <text class="mono" x="401" y="160" font-size="14" text-anchor="middle" font-weight="600">欠</text>
  <text x="401" y="196" font-size="14" text-anchor="middle" font-weight="600" fill="#bf8700">黄：byFa</text>
  <text class="sub" x="401" y="220" font-size="12.5" text-anchor="middle">不装，指望父亲来覆盖</text>
  <text class="sub" x="401" y="242" font-size="12" text-anchor="middle" fill="#cf222e">父亲的摄像头不在这棵子树里</text>
  <text class="sub" x="401" y="262" font-size="12" text-anchor="middle" fill="#cf222e">⇒ 子树内部欠着一份覆盖</text>

  <!-- ===== 红 ===== -->
  <rect x="532" y="80" width="236" height="196" fill="#ffffff" stroke="#cf222e" stroke-width="1.5" rx="8"/>
  <circle class="red" cx="650" cy="120" r="22"/>
  <text class="mono" x="650" y="126" font-size="14" text-anchor="middle" font-weight="600">✓</text>
  <line class="edge" x1="650" y1="142" x2="620" y2="164"/>
  <circle class="blue" cx="612" cy="176" r="14"/>
  <text class="mono" x="612" y="181" font-size="11" text-anchor="middle">装</text>
  <text x="650" y="212" font-size="14" text-anchor="middle" font-weight="600" fill="#cf222e">红：byChildren</text>
  <text class="sub" x="650" y="234" font-size="12.5" text-anchor="middle">不装，由某个儿子覆盖</text>
  <text class="sub" x="650" y="258" font-size="12" text-anchor="middle" font-weight="600">要求：至少一个儿子是蓝</text>

  <!-- ===== 合同 ===== -->
  <line x1="32" y1="298" x2="768" y2="298" stroke="#d0d7de" stroke-width="1"/>
  <text x="32" y="322" font-size="14" font-weight="600">三份合同的共同前提</text>
  <text class="sub" x="32" y="344" font-size="13">node 的整棵子树里，<tspan font-weight="600" fill="#1f2328">除 node 自己以外的所有节点都已被覆盖</tspan>；三者的区别只在 node 自己的处境。</text>

  <text x="32" y="378" font-size="14" font-weight="600">和 337 的分野</text>
  <line x1="32" y1="388" x2="768" y2="388" stroke="#d0d7de" stroke-width="1"/>
  <text class="sub" x="32" y="408" font-size="12.5">337 打家劫舍 III　　约束：相邻两点<tspan font-weight="600" fill="#1f2328">不能同时选</tspan>　　父亲要知道：孩子<tspan font-weight="600" fill="#1f2328">选没选</tspan>（1 bit）　⇒ 2 个状态</text>
  <text class="sub" x="32" y="430" font-size="12.5">968 监控二叉树　　　约束：每个点<tspan font-weight="600" fill="#1f2328">都必须被覆盖</tspan>　　父亲要知道：孩子<tspan font-weight="600" fill="#1f2328">被谁覆盖</tspan>（3 种）　⇒ 3 个状态</text>
</svg>
