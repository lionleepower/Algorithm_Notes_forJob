<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2328"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .sm{font-size:12px;fill:#57606a}
    .box{fill:#ffffff;stroke:#1f2328;stroke-width:1.6}
    .blue{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
    .red{fill:#ffebe9;stroke:#cf222e;stroke-width:2}
    .yel{fill:#fff8c5;stroke:#bf8700;stroke-width:2}
    .grn{fill:#dafbe1;stroke:#1a7f37;stroke-width:2}
    .dash{fill:none;stroke:#8c959f;stroke-width:1.6;stroke-dasharray:5 3}
    .lnk{stroke:#1f2328;stroke-width:1.8;fill:none;marker-end:url(#ar)}
    .lnkb{stroke:#0969da;stroke-width:2;fill:none;marker-end:url(#arb)}
    .lnkr{stroke:#cf222e;stroke-width:2;fill:none;marker-end:url(#arr)}
    .thin{stroke:#8c959f;stroke-width:1.4;fill:none}
  </style>
  <rect width="800" height="380" fill="#fbfbfd" rx="10"/>
  <text class="ttl" x="32" y="36">前缀和：任意区间和 = 两个前缀和之差</text>
  <text class="sub" x="32" y="58">s[i] 表示前 i 个数的和（s[0] = 0）；区间 [l, r] 的和 = s[r+1] − s[l]</text>
  <text class="sub" x="32" y="112">nums</text>
  <text class="sub" x="32" y="190">s</text>
  <rect class="box" x="169.0" y="92" width="70" height="38" rx="6"/>
  <text class="mono" x="204.0" y="116.0" text-anchor="middle" style="font-size:15px;">3</text>
  <text class="sm" x="204.0" y="148" text-anchor="middle">i=0</text>
  <rect class="blue" x="247.0" y="92" width="70" height="38" rx="6"/>
  <text class="mono" x="282.0" y="116.0" text-anchor="middle" style="font-size:15px;">1</text>
  <text class="sm" x="282.0" y="148" text-anchor="middle">i=1</text>
  <rect class="blue" x="325.0" y="92" width="70" height="38" rx="6"/>
  <text class="mono" x="360.0" y="116.0" text-anchor="middle" style="font-size:15px;">4</text>
  <text class="sm" x="360.0" y="148" text-anchor="middle">i=2</text>
  <rect class="blue" x="403.0" y="92" width="70" height="38" rx="6"/>
  <text class="mono" x="438.0" y="116.0" text-anchor="middle" style="font-size:15px;">1</text>
  <text class="sm" x="438.0" y="148" text-anchor="middle">i=3</text>
  <rect class="box" x="481.0" y="92" width="70" height="38" rx="6"/>
  <text class="mono" x="516.0" y="116.0" text-anchor="middle" style="font-size:15px;">5</text>
  <text class="sm" x="516.0" y="148" text-anchor="middle">i=4</text>
  <rect class="box" x="559.0" y="92" width="70" height="38" rx="6"/>
  <text class="mono" x="594.0" y="116.0" text-anchor="middle" style="font-size:15px;">9</text>
  <text class="sm" x="594.0" y="148" text-anchor="middle">i=5</text>
  <rect class="box" x="130" y="170" width="70" height="38" rx="6"/>
  <text class="mono" x="165.0" y="194.0" text-anchor="middle" style="font-size:15px;">0</text>
  <text class="sm" x="165.0" y="226" text-anchor="middle">s[0]</text>
  <rect class="yel" x="208" y="170" width="70" height="38" rx="6"/>
  <text class="mono" x="243.0" y="194.0" text-anchor="middle" style="font-size:15px;">3</text>
  <text class="sm" x="243.0" y="226" text-anchor="middle">s[1]</text>
  <rect class="box" x="286" y="170" width="70" height="38" rx="6"/>
  <text class="mono" x="321.0" y="194.0" text-anchor="middle" style="font-size:15px;">4</text>
  <text class="sm" x="321.0" y="226" text-anchor="middle">s[2]</text>
  <rect class="box" x="364" y="170" width="70" height="38" rx="6"/>
  <text class="mono" x="399.0" y="194.0" text-anchor="middle" style="font-size:15px;">8</text>
  <text class="sm" x="399.0" y="226" text-anchor="middle">s[3]</text>
  <rect class="yel" x="442" y="170" width="70" height="38" rx="6"/>
  <text class="mono" x="477.0" y="194.0" text-anchor="middle" style="font-size:15px;">9</text>
  <text class="sm" x="477.0" y="226" text-anchor="middle">s[4]</text>
  <rect class="box" x="520" y="170" width="70" height="38" rx="6"/>
  <text class="mono" x="555.0" y="194.0" text-anchor="middle" style="font-size:15px;">14</text>
  <text class="sm" x="555.0" y="226" text-anchor="middle">s[5]</text>
  <rect class="box" x="598" y="170" width="70" height="38" rx="6"/>
  <text class="mono" x="633.0" y="194.0" text-anchor="middle" style="font-size:15px;">23</text>
  <text class="sm" x="633.0" y="226" text-anchor="middle">s[6]</text>
  <text class="sub" x="130" y="262">求 nums[1..3] 的和 = 1 + 4 + 1 = 6</text>
  <text class="mono" x="130" y="284" style="font-size:13px;">= s[4] − s[1] = 9 − 3 = 6</text>
  <rect class="grn" x="32" y="310" width="736" height="56" rx="10"/>
  <text class="sub" x="48" y="334" style="fill:#1f2328;">加哈希：数「和为 k 的子数组」= 数有多少个旧前缀和等于 s[r+1] − k</text>
  <text class="sub" x="48" y="354">一边往右走一边把前缀和丢进哈希表，当前位置直接查表，O(n) 完成。</text>
</svg>
