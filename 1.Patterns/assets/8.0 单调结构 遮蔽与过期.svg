<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470">
  <defs>
    <marker id="z0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .ar{stroke:#57606a;stroke-width:2;fill:none;marker-end:url(#z0a)}
  </style>

  <rect width="800" height="470" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="38">8.x 的共同内核：及时去掉无用数据，保证结构有序</text>
  <text class="sub" x="32" y="60">两个专题只差一件事 ——「无用」有几种含义</text>

  <!-- 内核框 -->
  <rect x="32" y="80" width="736" height="62" fill="#ffffff" stroke="#8250df" stroke-width="2" rx="8"/>
  <text x="52" y="106" font-size="14" font-weight="600" fill="#8250df">永久淘汰论证（两个专题共用的地基）</text>
  <text class="sub" x="52" y="128" font-size="13">一个元素只要被「<tspan font-weight="600" fill="#1f2328">更近且不更小</tspan>」的元素遮蔽，就<tspan font-weight="600" fill="#1f2328">永远</tspan>不可能再成为任何人的答案 ⇒ 敢 pop，而不是 peek。</text>

  <!-- 左：单调栈 -->
  <rect x="32" y="162" width="356" height="176" fill="#ffffff" stroke="#0969da" stroke-width="1.5" rx="8"/>
  <text x="50" y="188" font-size="15" font-weight="600" fill="#0969da">单调栈　·　只有一种出局</text>
  <text class="sub" x="50" y="212" font-size="12.5">出局理由：<tspan font-weight="600" fill="#1f2328">被遮蔽</tspan>（看值）</text>
  <text class="sub" x="50" y="234" font-size="12.5">出口：<tspan class="mono">pop()</tspan>　一头进、一头出</text>
  <text class="sub" x="50" y="256" font-size="12.5">结构：<tspan class="mono">list</tspan> 即可</text>
  <line x1="50" y1="270" x2="370" y2="270" stroke="#d0d7de" stroke-width="1"/>
  <text class="sub" x="50" y="292" font-size="12.5">解决：<tspan font-weight="600" fill="#1f2328">上一个 / 下一个 更大 / 更小的元素</tspan></text>
  <text class="sub" x="50" y="314" font-size="12.5">代表：739 每日温度 · 42 接雨水 · 84 柱状图</text>
  <text class="mono" x="50" y="332" font-size="11.5" fill="#0969da">空间 O(n)</text>

  <!-- 右：单调队列 -->
  <rect x="412" y="162" width="356" height="176" fill="#ffffff" stroke="#bf8700" stroke-width="1.5" rx="8"/>
  <text x="430" y="188" font-size="15" font-weight="600" fill="#bf8700">单调队列　·　多一种出局</text>
  <text class="sub" x="430" y="212" font-size="12.5">出局理由①：<tspan font-weight="600" fill="#1f2328">被遮蔽</tspan>（看值）—— 同上</text>
  <text class="sub" x="430" y="234" font-size="12.5">出局理由②：<tspan font-weight="600" fill="#cf222e">过期</tspan>（看下标）—— 滑出窗口</text>
  <text class="sub" x="430" y="256" font-size="12.5">出口：<tspan class="mono">pop()</tspan> + <tspan class="mono">popleft()</tspan>　<tspan font-weight="600" fill="#1f2328">两头都要删</tspan></text>
  <line x1="430" y1="270" x2="750" y2="270" stroke="#d0d7de" stroke-width="1"/>
  <text class="sub" x="430" y="292" font-size="12.5">解决：<tspan font-weight="600" fill="#1f2328">定长窗口内的极值</tspan></text>
  <text class="sub" x="430" y="314" font-size="12.5">代表：239 滑动窗口最大值 · 1438 · 1696</text>
  <text class="mono" x="430" y="332" font-size="11.5" fill="#bf8700">结构必须是 deque　空间 O(k)</text>

  <!-- 选型 -->
  <line x1="32" y1="360" x2="768" y2="360" stroke="#d0d7de" stroke-width="1"/>
  <text x="32" y="384" font-size="14" font-weight="600">怎么选：看题目问的是「位置关系」还是「窗口极值」</text>

  <text class="mono" x="32" y="412" font-size="12.5">要算的东西涉及「上一个 / 下一个 更大 / 更小」</text>
  <path class="ar" d="M 402 407 L 448 407"/>
  <text class="sub" x="458" y="412" font-size="13" font-weight="600" fill="#0969da">单调栈</text>

  <text class="mono" x="32" y="440" font-size="12.5">定长窗口 + 求极值（且极值<tspan font-weight="600" fill="#cf222e">不可逆</tspan>，减不掉）</text>
  <path class="ar" d="M 402 435 L 448 435"/>
  <text class="sub" x="458" y="440" font-size="13" font-weight="600" fill="#bf8700">单调队列</text>

  <text class="sub" x="32" y="462" font-size="12">窗口里维护的量若<tspan font-weight="600" fill="#1f2328">可加可减</tspan>（和、计数、种类数），普通滑动窗口就够了，不需要单调结构。</text>
</svg>
