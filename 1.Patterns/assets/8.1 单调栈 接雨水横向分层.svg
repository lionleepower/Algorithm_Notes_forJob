<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .bar{fill:#57606a;stroke:#24292f;stroke-width:1.5}
    .barL{fill:#8c959f;stroke:#24292f;stroke-width:2}
    .barR{fill:#8c959f;stroke:#24292f;stroke-width:2}
    .w1{fill:#b6d7f5;stroke:#0969da;stroke-width:1.5}
    .w2{fill:#7cb9ec;stroke:#0969da;stroke-width:1.5}
  </style>

  <rect width="800" height="460" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="38">接雨水的第二种视角：横着一层一层填，而不是竖着按列算</text>
  <text class="sub" x="32" y="60">height = [4, 1, 0, 2, 3]　·　当 i=3（高度 2）到来时，它比栈顶高 ⇒ 连续弹出两次，每弹一次填一层</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="300" x2="480" y2="300" stroke="#8c959f" stroke-width="1.5"/>

  <!-- 水（先画，柱子压在上面） -->
  <rect class="w1" x="236" y="260" width="60" height="40"/>
  <rect class="w2" x="168" y="220" width="128" height="40"/>

  <!-- 柱子 -->
  <rect class="barL" x="100" y="140" width="60" height="160"/>
  <text class="mono" x="130" y="322" font-size="13" text-anchor="middle">0</text>
  <text class="mono" x="130" y="132" font-size="13" text-anchor="middle">4</text>

  <rect class="bar" x="168" y="260" width="60" height="40"/>
  <text class="mono" x="198" y="322" font-size="13" text-anchor="middle">1</text>

  <text class="mono" x="266" y="322" font-size="13" text-anchor="middle">2</text>

  <rect class="barR" x="304" y="220" width="60" height="80"/>
  <text class="mono" x="334" y="322" font-size="13" text-anchor="middle" font-weight="600" fill="#1a7f37">3 = i</text>
  <text class="mono" x="334" y="212" font-size="13" text-anchor="middle">2</text>

  <rect class="bar" x="372" y="180" width="60" height="120" opacity="0.35"/>
  <text class="mono" x="402" y="322" font-size="13" text-anchor="middle" fill="#8c959f">4</text>

  <text class="sub" x="266" y="252" font-size="11" text-anchor="middle" fill="#0969da" font-weight="600">第 1 层</text>
  <text class="sub" x="232" y="212" font-size="11" text-anchor="middle" fill="#0969da" font-weight="600">第 2 层</text>

  <!-- 右侧计算 -->
  <rect x="504" y="86" width="264" height="228" fill="#ffffff" stroke="#0969da" stroke-width="1.5" rx="8"/>
  <text x="522" y="112" font-size="14" font-weight="600" fill="#0969da">每弹一次 = 填一个横条</text>
  <text class="mono" x="522" y="140" font-size="12">bottom = 弹出的那根（坑底）</text>
  <text class="mono" x="522" y="158" font-size="12">left   = 弹完后的新栈顶</text>
  <text class="mono" x="522" y="176" font-size="12">right  = 当前的 i</text>
  <text class="mono" x="522" y="202" font-size="12.5" font-weight="600">dh = min(h[left], h[i]) - h[bottom]</text>
  <text class="mono" x="522" y="222" font-size="12.5" font-weight="600">w  = i - left - 1</text>
  <line x1="522" y1="238" x2="750" y2="238" stroke="#d0d7de" stroke-width="1"/>
  <text class="mono" x="522" y="258" font-size="11.5">① 弹 idx2(h0)：left=1, dh=1-0=1</text>
  <text class="mono" x="534" y="274" font-size="11.5">w=3-1-1=1　→　+1</text>
  <text class="mono" x="522" y="294" font-size="11.5">② 弹 idx1(h1)：left=0, dh=2-1=1</text>
  <text class="mono" x="534" y="310" font-size="11.5">w=3-0-1=2　→　+2</text>

  <!-- 底部对照 -->
  <line x1="32" y1="348" x2="768" y2="348" stroke="#d0d7de" stroke-width="1"/>
  <text x="32" y="372" font-size="14" font-weight="600">和 1.1 前后缀分解的分工</text>
  <text class="sub" x="32" y="396" font-size="12.5"><tspan font-weight="600" fill="#1f2328">纵向（前后缀 / 相向双指针）</tspan>：枚举每一<tspan font-weight="600">列</tspan>，这一列的水 = min(左边最高, 右边最高) − 自己的高度。</text>
  <text class="sub" x="32" y="418" font-size="12.5"><tspan font-weight="600" fill="#0969da">横向（单调栈）</tspan>：枚举每一<tspan font-weight="600">层</tspan>，遇到「上一个更大元素」时把中间那个坑填平，一层一个矩形。</text>
  <text class="sub" x="32" y="442" font-size="12.5">两者都是 O(n)，答案当然一致 —— 但只有横向这一套能迁移到 84 柱状图最大矩形，那题必须知道「左右第一个更小」。</text>
</svg>
