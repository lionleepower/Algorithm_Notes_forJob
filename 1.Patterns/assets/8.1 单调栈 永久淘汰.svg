<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <defs>
    <marker id="s1g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/>
    </marker>
    <marker id="s1r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .bar{fill:#eaeef2;stroke:#8c959f;stroke-width:1.5}
    .barK{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
    .barI{fill:#dafbe1;stroke:#1a7f37;stroke-width:2.5}
    .barJ{fill:#ffebe9;stroke:#cf222e;stroke-width:2.5}
    .ok{stroke:#1a7f37;stroke-width:2.5;fill:none;marker-end:url(#s1g)}
    .no{stroke:#cf222e;stroke-width:2.5;fill:none;marker-end:url(#s1r);stroke-dasharray:6 4}
  </style>

  <rect width="800" height="440" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="38">单调栈的全部秘密：一个元素一旦被「更近且不更小」的元素遮蔽，就<tspan fill="#cf222e">永远</tspan>无用</text>
  <text class="sub" x="32" y="60">不是「暂时用不上」，是「此后再无翻身机会」—— 所以敢 pop，而不是 peek</text>

  <!-- 柱状图 -->
  <line x1="60" y1="280" x2="740" y2="280" stroke="#8c959f" stroke-width="1.5"/>

  <rect class="barK" x="110" y="200" width="70" height="80"/>
  <text class="mono" x="145" y="228" font-size="15" text-anchor="middle" font-weight="600">2</text>
  <text class="mono" x="145" y="302" font-size="14" text-anchor="middle" fill="#0969da" font-weight="600">k</text>

  <rect class="bar" x="200" y="240" width="70" height="40"/>
  <rect class="bar" x="290" y="220" width="70" height="60"/>

  <rect class="barI" x="380" y="80" width="70" height="200"/>
  <text class="mono" x="415" y="118" font-size="15" text-anchor="middle" font-weight="600">5</text>
  <text class="mono" x="415" y="302" font-size="14" text-anchor="middle" fill="#1a7f37" font-weight="600">i</text>

  <rect class="bar" x="470" y="250" width="70" height="30"/>

  <rect class="barJ" x="560" y="120" width="70" height="160"/>
  <text class="mono" x="595" y="158" font-size="15" text-anchor="middle" font-weight="600">4</text>
  <text class="mono" x="595" y="302" font-size="14" text-anchor="middle" fill="#cf222e" font-weight="600">j</text>

  <text class="sub" x="60" y="330" font-size="12">← 更左</text>
  <text class="sub" x="700" y="330" font-size="12">更右 →</text>

  <!-- 箭头 -->
  <path class="ok" d="M 145 190 Q 280 110 375 100"/>
  <text class="sub" x="250" y="128" font-size="12.5" fill="#1a7f37" font-weight="600">k 往右找，先撞上 i</text>

  <path class="no" d="M 148 196 Q 360 380 592 292"/>
  <text class="sub" x="330" y="372" font-size="12.5" fill="#cf222e" font-weight="600">j 永远轮不到 —— 被 i 挡死了</text>

  <!-- 底部论证 -->
  <line x1="32" y1="392" x2="768" y2="392" stroke="#d0d7de" stroke-width="1"/>
  <text class="mono" x="32" y="414" font-size="13">i &lt; j 且 t[i] ≥ t[j]　⇒　对任意 k &lt; i：只要 j 能满足 k（t[j] &gt; t[k]），i 必然也满足，而且更早遇到</text>
  <text x="32" y="434" font-size="13" font-weight="600" fill="#cf222e">⇒ j 被 i 永久遮蔽，可以安全丢弃。等号也要 pop：t[i] = t[j] 时 j 对 i 自己无用，对 i 左边任何人也无用。</text>
</svg>
