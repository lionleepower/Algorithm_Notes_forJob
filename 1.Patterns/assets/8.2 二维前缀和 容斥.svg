<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460">
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .cap{font-size:13px;font-weight:600;fill:#0969da}
    .full{fill:#ffffff;stroke:#57606a;stroke-width:1.8}
    .a{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .b{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .ov{fill:#fff8c5;stroke:#bf8700;stroke-width:1.5}
    .tgt{fill:#ffebe9;stroke:#cf222e;stroke-width:2.2}
    .dash{stroke:#8c959f;stroke-width:1.2;stroke-dasharray:4 3;fill:none}
  </style>

  <rect width="820" height="460" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="36">二维前缀和：一维的「两点作差」升级成「四角容斥」</text>
  <text class="sub" x="32" y="58">S[i][j] 定义为左上角那块 i × j 矩形的和（1-indexed，多开一圈哨兵，省掉所有边界判断）。</text>

  <!-- ============ 左：建表 ============ -->
  <text class="cap" x="60" y="94">建表：横条 + 竖条会把左上角数两遍</text>

  <rect class="a"  x="60" y="108" width="200" height="86"/>
  <rect class="b"  x="60" y="108" width="150" height="126"/>
  <rect class="ov" x="60" y="108" width="150" height="86"/>
  <rect class="tgt" x="210" y="194" width="50" height="40"/>
  <rect class="dash" x="60" y="108" width="200" height="126"/>

  <text class="mono" x="235" y="150" font-size="12" text-anchor="middle" fill="#0969da">S[i−1][j]</text>
  <text class="mono" x="135" y="220" font-size="12" text-anchor="middle" fill="#1a7f37">S[i][j−1]</text>
  <text class="mono" x="135" y="155" font-size="12" text-anchor="middle" fill="#bf8700">S[i−1][j−1]</text>
  <text class="mono" x="235" y="218" font-size="12" text-anchor="middle" fill="#cf222e">a</text>

  <text class="mono" x="60" y="266" font-size="12.5" fill="#0969da">S[i][j] = S[i−1][j] + S[i][j−1] − S[i−1][j−1] + a[i−1][j−1]</text>
  <text class="sub" x="60" y="288" font-size="12.5">黄色那块被蓝、绿各数了一次，必须减掉一次；</text>
  <text class="sub" x="60" y="308" font-size="12.5">最后补上右下角这一个新格子。</text>

  <line x1="410" y1="80" x2="410" y2="330" stroke="#d0d7de" stroke-width="1"/>

  <!-- ============ 右：查询 ============ -->
  <text class="cap" x="450" y="94">查询：同一个容斥，方向反过来</text>

  <rect class="dash" x="450" y="108" width="240" height="150"/>
  <rect class="a"  x="450" y="108" width="240" height="60"/>
  <rect class="b"  x="450" y="108" width="90"  height="150"/>
  <rect class="ov" x="450" y="108" width="90"  height="60"/>
  <rect class="tgt" x="540" y="168" width="150" height="90"/>

  <text class="mono" x="615" y="142" font-size="12" text-anchor="middle" fill="#0969da">S[r1][c2+1]</text>
  <text class="mono" x="495" y="230" font-size="12" text-anchor="middle" fill="#1a7f37">S[r2+1][c1]</text>
  <text class="mono" x="495" y="142" font-size="11" text-anchor="middle" fill="#bf8700">S[r1][c1]</text>
  <text class="mono" x="615" y="218" font-size="13" text-anchor="middle" fill="#cf222e" font-weight="600">要求的子矩阵</text>
  <text class="mono sub" x="700" y="270" font-size="11.5">整块 = S[r2+1][c2+1]</text>

  <text class="mono" x="450" y="296" font-size="12.5" fill="#cf222e">sum = S[r2+1][c2+1] − S[r1][c2+1] − S[r2+1][c1] + S[r1][c1]</text>
  <text class="sub" x="450" y="318" font-size="12.5">减掉上条和左条后，左上角黄块被减了两次，加回来一次。</text>

  <line x1="32" y1="348" x2="788" y2="348" stroke="#d0d7de" stroke-width="1"/>

  <text x="32" y="376" font-size="14" font-weight="600" fill="#cf222e">为什么一定要 1-indexed 多开一圈</text>
  <text class="sub" x="32" y="400" font-size="12.5">建表时 i−1、j−1 会取到 −1；查询时 r1 可以是 0。多开一圈全 0 的哨兵行列后，这些越界访问全部落在合法的 0 上，四个公式再也不需要任何 if。</text>

  <text class="mono" x="32" y="434" font-size="12.5" fill="#0969da">二维差分（进阶）：给子矩阵整体 +v，在四角打点　d[r1][c1] += v　d[r1][c2+1] −= v　d[r2+1][c1] −= v　d[r2+1][c2+1] += v</text>
  <text class="sub" x="32" y="454" font-size="12.5">还原时做两遍前缀和（先按行再按列）。和一维完全同构，只是端点从 2 个变成 4 个。</text>
</svg>
