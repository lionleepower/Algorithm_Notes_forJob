<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <defs>
    <marker id="q1r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
    <marker id="q1o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf8700"/>
    </marker>
    <marker id="q1g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .cell{fill:#ffffff;stroke:#1f2328;stroke-width:2;rx:6}
    .head{fill:#fff8c5;stroke:#bf8700;stroke-width:2.5;rx:6}
    .tail{fill:#ffebe9;stroke:#cf222e;stroke-width:2.5;rx:6}
    .aR{stroke:#cf222e;stroke-width:2.5;fill:none;marker-end:url(#q1r)}
    .aO{stroke:#bf8700;stroke-width:2.5;fill:none;marker-end:url(#q1o)}
    .aG{stroke:#1a7f37;stroke-width:2.5;fill:none;marker-end:url(#q1g)}
  </style>

  <rect width="800" height="440" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="38">单调队列 = 单调栈 + 过期机制：所以必须用<tspan fill="#0969da">双端</tspan>队列</text>
  <text class="sub" x="32" y="60">栈只需回答「谁遮蔽了谁」；队列还要回答「谁已经不在场了」—— 两种出局，两个出口</text>

  <!-- 队列 -->
  <rect class="head" x="230" y="150" width="76" height="60"/>
  <text class="mono" x="268" y="180" font-size="16" text-anchor="middle" font-weight="600">9</text>
  <text class="sub"  x="268" y="200" font-size="11" text-anchor="middle" fill="#bf8700">队头 q[0]</text>

  <rect class="cell" x="314" y="150" width="76" height="60"/>
  <text class="mono" x="352" y="185" font-size="16" text-anchor="middle">6</text>

  <rect class="cell" x="398" y="150" width="76" height="60"/>
  <text class="mono" x="436" y="185" font-size="16" text-anchor="middle">4</text>

  <rect class="tail" x="482" y="150" width="76" height="60"/>
  <text class="mono" x="520" y="180" font-size="16" text-anchor="middle" font-weight="600">2</text>
  <text class="sub"  x="520" y="200" font-size="11" text-anchor="middle" fill="#cf222e">队尾 q[-1]</text>

  <text class="sub" x="394" y="134" font-size="12.5" text-anchor="middle">下标递增 →　　值严格递减 ↓</text>
  <text class="mono" x="268" y="238" font-size="12" text-anchor="middle" fill="#bf8700">窗口最大值就是它</text>

  <!-- 三个箭头 -->
  <path class="aO" d="M 224 180 L 150 180"/>
  <text class="sub" x="70" y="164" font-size="12.5" fill="#bf8700" font-weight="600">popleft()</text>
  <text class="sub" x="60" y="184" font-size="12" fill="#bf8700">过期：滑出窗口</text>
  <text class="sub" x="60" y="202" font-size="12" fill="#bf8700">看<tspan font-weight="600">下标</tspan></text>

  <path class="aR" d="M 564 180 L 638 180"/>
  <text class="sub" x="650" y="164" font-size="12.5" fill="#cf222e" font-weight="600">pop()</text>
  <text class="sub" x="650" y="184" font-size="12" fill="#cf222e">遮蔽：又大又新</text>
  <text class="sub" x="650" y="202" font-size="12" fill="#cf222e">看<tspan font-weight="600">值</tspan></text>

  <path class="aG" d="M 620 260 L 552 218"/>
  <text class="sub" x="628" y="272" font-size="12.5" fill="#1a7f37" font-weight="600">append(i)　新元素只从队尾进</text>

  <!-- 对照表 -->
  <line x1="32" y1="298" x2="768" y2="298" stroke="#d0d7de" stroke-width="1"/>
  <text class="sub" x="32" y="320" font-size="12" font-weight="600">出队方式</text>
  <text class="sub" x="150" y="320" font-size="12" font-weight="600">在哪一端</text>
  <text class="sub" x="260" y="320" font-size="12" font-weight="600">淘汰理由</text>
  <text class="sub" x="520" y="320" font-size="12" font-weight="600">判断依据</text>
  <line x1="32" y1="330" x2="768" y2="330" stroke="#d0d7de" stroke-width="1"/>

  <text class="mono" x="32"  y="354" font-size="12" fill="#cf222e">pop()</text>
  <text class="sub"  x="150" y="354" font-size="12">队尾</text>
  <text class="sub"  x="260" y="354" font-size="12">被遮蔽：新来的又大又新，旧的双重劣势</text>
  <text class="sub"  x="520" y="354" font-size="12" font-weight="600">看值</text>

  <text class="mono" x="32"  y="380" font-size="12" fill="#bf8700">popleft()</text>
  <text class="sub"  x="150" y="380" font-size="12">队头</text>
  <text class="sub"  x="260" y="380" font-size="12">过期：滑出窗口了，再大也没用</text>
  <text class="sub"  x="520" y="380" font-size="12" font-weight="600">看下标</text>
  <line x1="32" y1="392" x2="768" y2="392" stroke="#d0d7de" stroke-width="1"/>

  <text class="sub" x="32" y="414" font-size="12.5">队尾的淘汰论证与单调栈<tspan font-weight="600" fill="#1f2328">完全一致</tspan>：新元素更大 + 活得更久，旧元素永无翻身之日。</text>
  <text class="sub" x="32" y="434" font-size="12.5">队头则是全新的东西：<tspan font-weight="600" fill="#bf8700">它可能仍是队列里最大的，却因为滑出窗口被迫出局</tspan> —— 这是「窗口」独有的代价。</text>
</svg>
