<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470">
  <defs>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .cap{font-size:13px;font-weight:600;fill:#0969da}
    .c{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5;rx:5}
    .plus{fill:#dafbe1;stroke:#1a7f37;stroke-width:2;rx:5}
    .minus{fill:#ffebe9;stroke:#cf222e;stroke-width:2;rx:5}
    .band1{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5;rx:4}
    .band2{fill:#fff8c5;stroke:#bf8700;stroke-width:1.5;rx:4}
    .ar{stroke:#0969da;stroke-width:1.8;fill:none;marker-end:url(#arD)}
  </style>

  <rect width="820" height="470" fill="#fbfbfd" rx="10"/>

  <text class="ttl" x="32" y="36">差分：对一整段做的事，只在两个端点留痕</text>
  <text class="sub" x="32" y="58">d[i] = a[i] − a[i−1]，反过来 a 就是 d 的前缀和。于是「区间 [l, r] 全体 +v」等价于「d[l] += v 且 d[r+1] −= v」。</text>

  <!-- 下标 -->
  <text class="mono sub" x="130" y="98" font-size="12" text-anchor="end">下标</text>
  <text class="mono sub" x="172" y="98" font-size="12" text-anchor="middle">0</text>
  <text class="mono sub" x="244" y="98" font-size="12" text-anchor="middle">1</text>
  <text class="mono sub" x="316" y="98" font-size="12" text-anchor="middle">2</text>
  <text class="mono sub" x="388" y="98" font-size="12" text-anchor="middle">3</text>
  <text class="mono sub" x="460" y="98" font-size="12" text-anchor="middle">4</text>
  <text class="mono sub" x="532" y="98" font-size="12" text-anchor="middle">5</text>
  <text class="mono sub" x="604" y="98" font-size="12" text-anchor="middle">6</text>
  <text class="mono sub" x="676" y="98" font-size="12" text-anchor="middle">7</text>

  <!-- 两个操作 -->
  <text class="cap" x="130" y="128" text-anchor="end" font-size="12.5">操作</text>
  <rect class="band1" x="286" y="112" width="276" height="20"/>
  <text class="mono" x="424" y="127" font-size="12" text-anchor="middle" fill="#0969da">[2, 5] 全体 +3</text>
  <rect class="band2" x="430" y="138" width="204" height="20"/>
  <text class="mono" x="532" y="153" font-size="12" text-anchor="middle" fill="#bf8700">[4, 6] 全体 +2</text>

  <!-- 差分数组 -->
  <text class="cap" x="130" y="200" text-anchor="end">差分 d</text>
  <rect class="c"     x="142" y="176" width="60" height="38"/><text class="mono" x="172" y="201" font-size="15" text-anchor="middle">0</text>
  <rect class="c"     x="214" y="176" width="60" height="38"/><text class="mono" x="244" y="201" font-size="15" text-anchor="middle">0</text>
  <rect class="plus"  x="286" y="176" width="60" height="38"/><text class="mono" x="316" y="201" font-size="15" text-anchor="middle" fill="#1a7f37">+3</text>
  <rect class="c"     x="358" y="176" width="60" height="38"/><text class="mono" x="388" y="201" font-size="15" text-anchor="middle">0</text>
  <rect class="plus"  x="430" y="176" width="60" height="38"/><text class="mono" x="460" y="201" font-size="15" text-anchor="middle" fill="#1a7f37">+2</text>
  <rect class="c"     x="502" y="176" width="60" height="38"/><text class="mono" x="532" y="201" font-size="15" text-anchor="middle">0</text>
  <rect class="minus" x="574" y="176" width="60" height="38"/><text class="mono" x="604" y="201" font-size="15" text-anchor="middle" fill="#cf222e">−3</text>
  <rect class="minus" x="646" y="176" width="60" height="38"/><text class="mono" x="676" y="201" font-size="15" text-anchor="middle" fill="#cf222e">−2</text>

  <text class="mono sub" x="722" y="196" font-size="11.5">两次区间修改</text>
  <text class="mono sub" x="722" y="212" font-size="11.5">只改了 4 个格子</text>

  <path class="ar" d="M 380 230 L 380 254"/>
  <text class="mono sub" x="396" y="248" font-size="12">做一次前缀和还原</text>

  <!-- 还原后的数组 -->
  <text class="cap" x="130" y="290" text-anchor="end">还原 a</text>
  <rect class="c" x="142" y="266" width="60" height="38"/><text class="mono" x="172" y="291" font-size="15" text-anchor="middle">0</text>
  <rect class="c" x="214" y="266" width="60" height="38"/><text class="mono" x="244" y="291" font-size="15" text-anchor="middle">0</text>
  <rect class="c" x="286" y="266" width="60" height="38"/><text class="mono" x="316" y="291" font-size="15" text-anchor="middle">3</text>
  <rect class="c" x="358" y="266" width="60" height="38"/><text class="mono" x="388" y="291" font-size="15" text-anchor="middle">3</text>
  <rect class="c" x="430" y="266" width="60" height="38"/><text class="mono" x="460" y="291" font-size="15" text-anchor="middle">5</text>
  <rect class="c" x="502" y="266" width="60" height="38"/><text class="mono" x="532" y="291" font-size="15" text-anchor="middle">5</text>
  <rect class="c" x="574" y="266" width="60" height="38"/><text class="mono" x="604" y="291" font-size="15" text-anchor="middle">2</text>
  <rect class="c" x="646" y="266" width="60" height="38"/><text class="mono" x="676" y="291" font-size="15" text-anchor="middle">0</text>

  <line x1="32" y1="330" x2="788" y2="330" stroke="#d0d7de" stroke-width="1"/>

  <text x="32" y="358" font-size="14" font-weight="600" fill="#cf222e">两个必记的细节</text>
  <text class="sub" x="32" y="382" font-size="12.5">1. 减号打在 <tspan class="mono">r+1</tspan> 而不是 <tspan class="mono">r</tspan> —— 差分作用的是「从这一格开始的所有后缀」，要让 r 仍然享受到 +v，撤销必须发生在它的下一格。</text>
  <text class="sub" x="32" y="404" font-size="12.5">2. 数组要开 <tspan class="mono">n+1</tspan> 长 —— r 可以取到 n−1，<tspan class="mono">d[r+1]</tspan> 就要写到下标 n。开 n 长会越界或静默丢掉最后一次撤销。</text>

  <text class="mono" x="32" y="440" font-size="12.5" fill="#0969da">复杂度：q 次区间修改 + 一次全量查询　朴素 O(nq) → 差分 O(n + q)</text>
  <text class="sub" x="32" y="460" font-size="12.5">适用前提：<tspan font-weight="600">所有修改都做完了才查询</tspan>。改一次查一次的交替场景要上树状数组 / 线段树。</text>
</svg>
