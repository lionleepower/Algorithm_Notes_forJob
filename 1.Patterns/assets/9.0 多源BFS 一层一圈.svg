  <text class="mono" x="290.0" y="177.0" text-anchor="middle" style="font-size:16px;">3</text>
  <rect x="40" y="202" width="52" height="52" rx="6" fill="#fff8c5" stroke="#8c959f" stroke-width="1.2"/>
  <text class="mono" x="66.0" y="233.0" text-anchor="middle" style="font-size:16px;">2</text>
  <rect x="96" y="202" width="52" height="52" rx="6" fill="#eef7e4" stroke="#8c959f" stroke-width="1.2"/>
  <text class="mono" x="122.0" y="233.0" text-anchor="middle" style="font-size:16px;">3</text>
  <rect x="152" y="202" width="52" height="52" rx="6" fill="#dafbe1" stroke="#8c959f" stroke-width="1.2"/>
  <text class="mono" x="178.0" y="233.0" text-anchor="middle" style="font-size:16px;">4</text>
  <rect x="208" y="202" width="52" height="52" rx="6" fill="#eef7e4" stroke="#8c959f" stroke-width="1.2"/>
  <text class="mono" x="234.0" y="233.0" text-anchor="middle" style="font-size:16px;">3</text>
  <rect x="264" y="202" width="52" height="52" rx="6" fill="#fff8c5" stroke="#8c959f" stroke-width="1.2"/>
  <text class="mono" x="290.0" y="233.0" text-anchor="middle" style="font-size:16px;">2</text>
  <rect x="40" y="258" width="52" height="52" rx="6" fill="#eef7e4" stroke="#8c959f" stroke-width="1.2"/>
  <text class="mono" x="66.0" y="289.0" text-anchor="middle" style="font-size:16px;">3</text>
