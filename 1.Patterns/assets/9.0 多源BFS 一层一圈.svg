  <text class="mono" x="178.0" y="289.0" text-anchor="middle" style="font-size:16px;">3</text>
  <rect x="208" y="258" width="52" height="52" rx="6" fill="#fff8c5" stroke="#8c959f" stroke-width="1.2"/>
  <text class="mono" x="234.0" y="289.0" text-anchor="middle" style="font-size:16px;">2</text>
  <rect x="264" y="258" width="52" height="52" rx="6" fill="#fff1cc" stroke="#8c959f" stroke-width="1.2"/>
  <text class="mono" x="290.0" y="289.0" text-anchor="middle" style="font-size:16px;">1</text>
  <rect x="40" y="314" width="52" height="52" rx="6" fill="#dafbe1" stroke="#8c959f" stroke-width="1.2"/>
  <text class="mono" x="66.0" y="345.0" text-anchor="middle" style="font-size:16px;">4</text>
  <rect x="96" y="314" width="52" height="52" rx="6" fill="#eef7e4" stroke="#8c959f" stroke-width="1.2"/>
  <text class="mono" x="122.0" y="345.0" text-anchor="middle" style="font-size:16px;">3</text>
  <rect x="152" y="314" width="52" height="52" rx="6" fill="#fff8c5" stroke="#8c959f" stroke-width="1.2"/>
  <text class="mono" x="178.0" y="345.0" text-anchor="middle" style="font-size:16px;">2</text>
  <rect x="208" y="314" width="52" height="52" rx="6" fill="#fff1cc" stroke="#8c959f" stroke-width="1.2"/>
  <text class="mono" x="234.0" y="345.0" text-anchor="middle" style="font-size:16px;">1</text>
  <rect x="264" y="314" width="52" height="52" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="2.4"/>
  <text class="mono" x="290.0" y="345.0" text-anchor="middle" style="font-size:16px;">0</text>
  <text class="sm" x="40" y="392">红框 = 起点（时间 0）</text>
  <text class="sub" x="360" y="104" style="font-weight:600;">队列每一轮的内容</text>
  <rect class="red" x="360" y="120" width="400" height="44" rx="8"/>
  <text class="mono" x="374" y="147" style="font-size:13px;font-weight:600;">第 0 轮</text>
  <text class="sub" x="450" y="147">两个起点同时入队</text>
  <rect class="yel" x="360" y="176" width="400" height="44" rx="8"/>
  <text class="mono" x="374" y="203" style="font-size:13px;font-weight:600;">第 1 轮</text>
  <text class="sub" x="450" y="203">它们各自的上下左右</text>
  <rect class="yel" x="360" y="232" width="400" height="44" rx="8"/>
  <text class="mono" x="374" y="259" style="font-size:13px;font-weight:600;">第 2 轮</text>
  <text class="sub" x="450" y="259">再外一圈……</text>
  <rect class="box" x="360" y="288" width="400" height="44" rx="8"/>
  <text class="mono" x="374" y="315" style="font-size:13px;font-weight:600;">……</text>
  <text class="sub" x="450" y="315">直到队列空或没有新鲜的格子</text>
  <text class="sub" x="360" y="360">「先冻结本层长度，再逐个出队」就是把层切开的那一刀。</text>
  <text class="sub" x="360" y="380">答案（分钟数）= 最后一层的层号。</text>
</svg>
