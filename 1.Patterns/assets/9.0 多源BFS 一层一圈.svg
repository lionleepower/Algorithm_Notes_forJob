  <text class="mono" x="66.0" y="177.0" text-anchor="middle" style="font-size:16px;">1</text>
  <rect x="96" y="146" width="52" height="52" rx="6" fill="#fff8c5" stroke="#8c959f" stroke-width="1.2"/>
