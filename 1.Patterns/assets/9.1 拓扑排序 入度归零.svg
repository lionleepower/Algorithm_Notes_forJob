<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2328"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .sm{font-size:12px;fill:#57606a}
    .box{fill:#ffffff;stroke:#1f2328;stroke-width:1.6}
    .blue{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
    .red{fill:#ffebe9;stroke:#cf222e;stroke-width:2}
    .yel{fill:#fff8c5;stroke:#bf8700;stroke-width:2}
    .grn{fill:#dafbe1;stroke:#1a7f37;stroke-width:2}
    .dash{fill:none;stroke:#8c959f;stroke-width:1.6;stroke-dasharray:5 3}
    .lnk{stroke:#1f2328;stroke-width:1.8;fill:none;marker-end:url(#ar)}
    .lnkb{stroke:#0969da;stroke-width:2;fill:none;marker-end:url(#arb)}
    .lnkr{stroke:#cf222e;stroke-width:2;fill:none;marker-end:url(#arr)}
    .thin{stroke:#8c959f;stroke-width:1.4;fill:none}
  </style>
  <rect width="800" height="380" fill="#fbfbfd" rx="10"/>
  <text class="ttl" x="32" y="36">拓扑排序：每次拿走「入度为 0」的点，它指向的点入度减 1</text>
  <text class="sub" x="32" y="58">边 a→b 表示「先修 a 才能修 b」；有环时永远凑不出入度为 0 的点</text>
  <path class="lnk" d="M 112.8 137.6 L 245.3 181.8"/>
  <path class="lnk" d="M 112.8 242.4 L 245.3 198.2"/>
  <path class="lnk" d="M 292.8 182.4 L 425.3 138.2"/>
  <path class="lnk" d="M 292.8 197.6 L 425.3 241.8"/>
  <path class="lnk" d="M 472.8 137.6 L 605.3 181.8"/>
  <path class="lnk" d="M 472.8 242.4 L 605.3 198.2"/>
  <circle class="grn" cx="90" cy="130" r="22"/>
  <text class="mono" x="90" y="135" text-anchor="middle" style="font-size:15px;">0</text>
  <text class="sm" x="90" y="98" text-anchor="middle" style="fill:#1a7f37;">入度 0</text>
  <circle class="grn" cx="90" cy="250" r="22"/>
  <text class="mono" x="90" y="255" text-anchor="middle" style="font-size:15px;">1</text>
  <text class="sm" x="90" y="218" text-anchor="middle" style="fill:#1a7f37;">入度 0</text>
  <circle class="box" cx="270" cy="190" r="22"/>
  <text class="mono" x="270" y="195" text-anchor="middle" style="font-size:15px;">2</text>
  <text class="sm" x="270" y="158" text-anchor="middle" style="fill:#57606a;">入度 2</text>
  <circle class="box" cx="450" cy="130" r="22"/>
  <text class="mono" x="450" y="135" text-anchor="middle" style="font-size:15px;">3</text>
  <text class="sm" x="450" y="98" text-anchor="middle" style="fill:#57606a;">入度 1</text>
  <circle class="box" cx="450" cy="250" r="22"/>
  <text class="mono" x="450" y="255" text-anchor="middle" style="font-size:15px;">4</text>
  <text class="sm" x="450" y="218" text-anchor="middle" style="fill:#57606a;">入度 1</text>
  <circle class="box" cx="630" cy="190" r="22"/>
  <text class="mono" x="630" y="195" text-anchor="middle" style="font-size:15px;">5</text>
  <text class="sm" x="630" y="158" text-anchor="middle" style="fill:#57606a;">入度 2</text>
  <text class="sub" x="32" y="330">队列初始 = [0, 1]（入度为 0）。出队 0 → 2 的入度 2→1；出队 1 → 2 的入度 1→0，2 入队；……</text>
  <text class="sub" x="32" y="352">最后 order 里装满全部 n 个点 = 无环；少了 = 剩下的点互相等待 = 有环。</text>
</svg>
