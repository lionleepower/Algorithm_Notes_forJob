<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2328"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;fill:#1f2328}
    .mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
    .ttl{font-size:18px;font-weight:600}
    .sub{font-size:13px;fill:#57606a}
    .sm{font-size:12px;fill:#57606a}
    .box{fill:#ffffff;stroke:#1f2328;stroke-width:1.6}
    .blue{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
    .red{fill:#ffebe9;stroke:#cf222e;stroke-width:2}
    .yel{fill:#fff8c5;stroke:#bf8700;stroke-width:2}
    .grn{fill:#dafbe1;stroke:#1a7f37;stroke-width:2}
    .dash{fill:none;stroke:#8c959f;stroke-width:1.6;stroke-dasharray:5 3}
    .lnk{stroke:#1f2328;stroke-width:1.8;fill:none;marker-end:url(#ar)}
    .lnkb{stroke:#0969da;stroke-width:2;fill:none;marker-end:url(#arb)}
    .lnkr{stroke:#cf222e;stroke-width:2;fill:none;marker-end:url(#arr)}
    .thin{stroke:#8c959f;stroke-width:1.4;fill:none}
  </style>
  <rect width="800" height="400" fill="#fbfbfd" rx="10"/>
  <text class="ttl" x="32" y="36">并查集：用「指向父亲」的森林表示集合，两个操作都靠找根</text>
  <text class="sub" x="32" y="58">find 找根（顺手路径压缩）；union 把一个根挂到另一个根下面</text>
  <text class="sub" x="32" y="96" style="font-weight:600;">union(3, 5)：根挂根</text>
  <path class="thin" d="M 120 150 L 90 192"/>
  <path class="thin" d="M 120 150 L 150 192"/>
  <circle class="yel" cx="120" cy="132" r="18"/>
  <text class="mono" x="120" y="137" text-anchor="middle" style="font-size:14px;">1</text>
  <circle class="box" cx="90" cy="210" r="18"/>
  <text class="mono" x="90" y="215" text-anchor="middle" style="font-size:14px;">2</text>
  <circle class="box" cx="150" cy="210" r="18"/>
  <text class="mono" x="150" y="215" text-anchor="middle" style="font-size:14px;">3</text>
  <path class="thin" d="M 260 150 L 260 192"/>
  <circle class="yel" cx="260" cy="132" r="18"/>
  <text class="mono" x="260" y="137" text-anchor="middle" style="font-size:14px;">4</text>
  <circle class="box" cx="260" cy="210" r="18"/>
  <text class="mono" x="260" y="215" text-anchor="middle" style="font-size:14px;">5</text>
  <text class="sm" x="190" y="252" text-anchor="middle">两个集合，根分别是 1 和 4</text>
  <path class="lnk" d="M 330 170 L 410 170"/>
  <text class="sm" x="370" y="160" text-anchor="middle">合并</text>
  <path class="thin" d="M 590 150 L 540 192"/>
  <path class="thin" d="M 590 150 L 640 192"/>
  <path class="thin" d="M 640 228 L 610 262"/>
  <path class="thin" d="M 640 228 L 670 262"/>
  <circle class="yel" cx="590" cy="132" r="18"/>
  <text class="mono" x="590" y="137" text-anchor="middle" style="font-size:14px;">4</text>
  <circle class="box" cx="540" cy="210" r="18"/>
  <text class="mono" x="540" y="215" text-anchor="middle" style="font-size:14px;">5</text>
  <circle class="box" cx="640" cy="210" r="18"/>
  <text class="mono" x="640" y="215" text-anchor="middle" style="font-size:14px;">1</text>
  <circle class="box" cx="610" cy="280" r="18"/>
  <text class="mono" x="610" y="285" text-anchor="middle" style="font-size:14px;">2</text>
  <circle class="box" cx="670" cy="280" r="18"/>
  <text class="mono" x="670" y="285" text-anchor="middle" style="font-size:14px;">3</text>
  <text class="sm" x="590" y="322" text-anchor="middle">根 1 挂到根 4 下面：fa[1] = 4</text>
  <text class="sub" x="32" y="352">路径压缩：find 走到根之后，沿途每个点直接指向根 —— 链 0→1→2→3 变成星形，之后一步到位</text>
  <text class="sm" x="32" y="376">（配合「小的挂到大的下面」按秩合并，几乎是 O(1)；面试里只写路径压缩就够用）</text>
</svg>
